    <p>I don't know about you, but I personally find cars and electrical appliances mysterious and intimidating.  I have great respect for people who are able to delve into the depths of electrical wiring or car engines, figure out what is wrong and repair it, using tools, experience and a variety of other skills.</p>
    <p>I always felt bad that I didn't know how to do those things, until not that long ago I had an epiphany - I work in just as mysterious and intimidating a medium, from their point of view.  And I get paid a hell of a lot more to do it!</p>
    <p>I mean, I bet you can properly analyze a computer problem over the phone.  I bet you can hear a description of a problem in the software, and correctly guess where the problem can probably be found  80%+ of the time.</p>
    <p>If you've done any hardware swapping, you probably feel comfortable installing drives, perhaps even diagnosing bad power supplies, or swapping out motherboards.</p>
    <p>And, of course, you almost certainly know how to write programs that do interesting things, which is similar to building your own vehicle from scratch.</p>
    <p>All of those things are intimidating and scary to most people.</p>
    <p>Happy Birthday!</p>
