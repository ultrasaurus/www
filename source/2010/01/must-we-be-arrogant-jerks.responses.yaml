  content: |-
    <p>I think a lot of women's issues in this regard isn't being the obnoxious jerk, but the *fear* of being the obnoxious jerk. If we stopped being self-conscious (which I construe as a social paradigm and not some intrinsic failing) then life opens up lots and lots of options.</p>
    <p>And it's not just a burden on our shoulder- every time someone thinks "she doesn't really know that," or "women in power are so bitchy" they are playing into the social stereotypes of making women in the public eye self-conscious for what they say and know. Whereas, we rarely give men that much scrutiny. Not that we should all start bullshitting about things we don't know about- but more- let's be honest in our criticism. Do we question men who speak at conferences as roughly as we do women? Or do we just turn away and decide not to listen?</p>
    <p>I was at a party as a precursor to She's Geeky weekend, and an old friend started criticizing a female speaker as, "well she doesn't know what she's talking about." It really pissed me off, as 1) the speaker did 2) the old friend had no idea what she was talking about 3) she was passing on her husband's views without thinking. It was sad, and yet another way that we fall into this world view of taking down women in power, or women in the spotlight. I new the backstory- her husband was jealous that this woman was getting more speaking opportunities. It was petty, and her passing on the information in a kind of conspiratoral gossipy way was classic, and sad, too.</p>
    <p>I agree that women don't self-promote that well, and it's something I strive to do with friends, buoy them up and give them confidence to present their ideas. I try to attend almost all the talks my friends give, because as an audience member, we can help almost as much as being another speaker at the event.</p>
- id: 652
  author: "Valerie"
  url: "http://www.balsamiq.com"
  date: '2010-02-21T23:27:45-08:00'
  content: |-
    <p>I thought of your post tonight as my daughter and her (coincidentally all-female) high school study group were writing their self-reviews for a class. "I feel like I am defending myself instead of just trying to list what I have done. This is so hard!"  I was pleased to listen from a distance as the girls worked out their self-doubts together. They each took time to praise, recall and support the efforts of their peers and encourage inclusion of positive experiences that the girls initially were hesitant to note about themselves. In the end, each seemed to come up with an honest review of her work. I feel great about this next generation.</p>
