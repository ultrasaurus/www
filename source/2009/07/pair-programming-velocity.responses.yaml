- id: 571
  author: "Wolfram Arnold"
  url: "http://www.rubyfocus.biz"
  date: '2009-07-25T19:13:27-08:00'
  content: |-
    <p>Wow, Sarah!  Thanks for the compliments.  The pleasure was all mine.  I've found pairing most fun and effective with another curious sharp mind on my side.  I've been lucky in that regard, in several projects, including my first consulting experience with Scott Johnson at EduFire.com and now most recently with you for Mightyverse.com. What matters is the willingness to make a better product, to improve the quality of the code, the pragmatism of a business person and the sense of aesthetics of the artist.  And one to keep me in check on all those aspects.</p>
    <p>In many ways I'm just passing on what I learned from others before, like the folks at Pivotal Labs that really showed me the ropes in pair programming, Agile development, leveraging Rails to the fullest.  Some practical considerations that I find key are:</p>
    <p>Equal access to the machine by either pairing partner--that includes the physical seating position in front of the monitor and of course dual keyboards and mice--but also things like common tools so that either partner feels more or less at home.  This might just be the time to look at IDE's such as RubyMine and leave Emacs and vi for editing config files on remote servers.  I also like the Mac/Linux environment we've had.  Adapting to the Mac keyboard when coming from Linux is easy enough, but dealing with backslashes and other quirks of Windows might cut into your ROI more than switching to a Mac/Linux environment would be.</p>
