  content: |-
    <p>Ah, the joys of 'vi'...</p>
    <p>Back when I was on the C++ Standards Committee, I used a Psion handheld computer as my primary traveling machine and had a port of 'vi' running on it that I used to edit the troff pages that generated the ISO/ANSI draft documents.</p>
    <p>Admittedly I used the Psion word processor for taking meeting notes (I was secretary of J16 for three years)...</p>
    <p>I'll be interested to read how you get on with Eclipse. I use it for all my day-to-day coding these days. It has its quirks but overall it's a good, solid IDE.</p>
