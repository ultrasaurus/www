  content: |-
    <p>I think that the software will be there way before what is necessary. What is really necessary is the hardware and networks. There must be high speed wireless networks EVERYWHERE! And the cost must be fixed regarless of usage. I think that if the government really wanted to create an infrustracture for the future, this would be all that they would do. Create the Wide EVERYWHERE network. Right now I feel like a person in the rural areas way back when they started putting in telephones. But at least the gov. made the companies get access to everybody.<br>
    I have been in the Web industry for many many years now, but at my home I still cannot receive ANY sort of high speed network. Not cable, not ISDN, not DSL, not wireless, nothing.</p>
