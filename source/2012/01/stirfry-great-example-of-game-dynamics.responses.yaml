    <p>"Secondly, including an aspect of chance and randomness in the reward system makes it more addictive."</p>
    <p>"According to Mr. Howard-Jones, students learn more, and are happier to continue learning, when they are offered the chance of a reward rather than a guaranteed reward. "</p>
    <p>Now that is interesting. I would never have guessed that a chance at a reward would TRUMP a guaranteed reward. I would have thought it would be competitive, but not victorious. Cool post.</p>
