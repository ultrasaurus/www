- id: 493
  author: "Matthew Lang"
  url: "http://matthewlang.co.uk"
  date: '2009-05-06T11:56:38-08:00'
  content: |-
    <p>Great piece Sarah!</p>
    <p>It seems that API design has been left out for some time now while Rails developers got fixed on the new application specific features that the framework had to offer.</p>
    <p>With the new Rails 3 framework started, and tech like Rails Metal, Rack and Sinatra, more and more developers might start caring more for their API design as well as their application design.</p>
- id: 495
  author: "ste"
  date: '2009-05-07T03:05:24-08:00'
  content: |-
    <p>"Rails seems to assume that you want to expose your database object model transparently through your API.  "<br>
    Rails doesn't assume this, like it doesn't assume that you should have an isomorphic mapping between models and controllers. It's all about exposing resources: the fact that most developers seem to equate resources with models (and, therefore, tend to expose their object model through their APIs) has nothing to do with Rails (well, maybe the guilt is partly to lay on scaffolding, which may have encouraged this mindset)</p>
