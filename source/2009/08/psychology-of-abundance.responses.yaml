  date: '2009-08-03T10:26:52-08:00'
  content: |-
    <p>These are so great- sadly I couldn't make this one- but I wanted to comment here on your post. I think you're totally right on about the volunteer-attendant ratio. Also, it's teaching the volunteers in the community to be teachers. That's not a natural gift for most of us, so learning about it is important, and it helps the diversity of any group if the participants become the teachers, then they help people like them enter the community. Really great project you &amp; Sarah are doing and it's quite exciting!</p>
