  content: |-
    <p>Sarah, <br>
    Wonderful post on the evolution of language. I hope to follow the thread of music as the precursor to formed words with meaning. It's especially interesting to ponder the role of lullabies. It strikes me that Oliver Saks recent book on music, Musicophilia might have some interesting references in this regard. In Saks style it's well footnoted with some great references that I hope to have the time to read.</p>
