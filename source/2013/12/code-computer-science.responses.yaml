- id: 3684
  author: "Alan"
  date: '2013-12-24T16:54:34-08:00'
  content: |-
    <p>I have a degree in computer science from a university whose computer science department is consistently rated in the top 10 in the United States.  I'm not a web developer.  (There, does that make me relevant to you?)  The computer science courses were (with one exception) the worst classes I took during my 4 years there, and not by a small margin.</p>
    <p>Who needs to pay tens of thousands of dollars to sit in a gigantic auditorium while some postdoc reads from the textbook, in an accent so thick I can barely understand?  That's what most computer science classes were -- I can't imagine what an 'average' school is like.</p>
    <p>I won't say that a degree is worthless -- every degree has value -- but I do believe I would be exactly as good a developer today if I had gotten my major in mathematics or physics or engineering or Attic Greek.  Most of the best developers I know don't have degrees in computer science, and most of the computer science I know didn't come from computer science classes.</p>
    <p>I would advise anyone going to school today to not get a degree in computer science, even if they want to be a computer programmer.  Get it in physics, or mathematics, or linguistics, or Mandarin literature, or whatever excites you.  It won't stop you from learning programming or computer science, and there are a million possible programming-related side projects in every department.  Sure, take a couple computer science courses, if the course happens to be something that especially interests you, and if it's being taught by a full professor who is recommended for their teaching ability.</p>
    <p>But do yourself a favor and don't waste any hours of your college years sitting in an auditorium listening to some postdoc try to read "CLR", and being unable to answer any questions about it.  And whatever you do, don't lock yourself into a degree program where you have to waste 50% of your college career in such nonsense.  Maybe at MIT and Berkeley it's better, but you don't have to go down the list of schools very far at all to get into truly terrible CS teaching.</p>
