- id: 3401
  author: "Dennis Groves"
  date: '2013-12-24T02:56:36-08:00'
  content: |-
    <p>A CS degree doesn't make you a scientist. However, we do have many computer artists; they write code, and many are able to learn it without formal education. Many get formal education and it masquerades as a CS degree. However, the ability to write code doesn't qualify one as a scientist or engineer! Science and engineering are far more structured and disciplined that the average 'computer science'</p>
    <p>There are three very different concepts. Ability to Code, Computer Science, Software Engineering.</p>
    <p>Just because I can do some maths, doesn't make me a mathematician! And while there are many mathematicians, there are even fewer who have invented (engineered) new maths! Similarly, code today is literacy, its just like knowing maths. Many people have this skill, and some are better at it than others. However, they ignorantly confuse themselves with mathematicians and math engineers.</p>
    <p>Can you imagine getting a physics degree and not knowing the history of physics? And yet this is a very common situation with people whom can code (or teach themselves to code) - they reinvent the past more poorly because they haven't a clue about what anybody has done before them! In fact they figure themselves clever for reinventing a flat-tire!</p>
- id: 3428
  author: "Bill Wixon"
  date: '2013-12-24T04:01:08-08:00'
  content: |-
    <p>I think the point you are trying to make doesn't require a CS degree or at least a traditional one. As a developer with an undergrad in SE and a Masters in it I think traditional CS degrees are not worth the money for what we do. In many traditional CS degrees you leave college with a lot of theory and a math minor. I would rather students get a CS degree with a business minor and far less math or theory. Most of us don't write compilers or heavily-optimized algorithms. The hard part is understanding process and turning business requirements into software.</p>
    <p>As someone else stated, what we get out of college is how to learn and teach ourselves.</p>
