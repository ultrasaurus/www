    <p>I very much agree.  It is not hard to create create create content of questionable worth.  It is a bit harder to edit, to set up the filters (of code, photographs, songs, drawing) to find the diamonds in the rough.  The process of distilling out the good stuff.</p>
    <p>A recent Radio Lab [0] show addressed the production of sprucing up potentially boring science-related interviews for consumption by the general public on radio shows.  It makes me want to start writing on a pop computer-science book for the masses.</p>
    <p>[0] <a href="http://www.wnyc.org/shows/radiolab/" rel="nofollow ugc">http://www.wnyc.org/shows/radiolab/</a></p>
