  content: |-
    <p>Just on the music side, from one that suffers from lack of remembering groups and song names to another, I found this to be helpful: <a href="http://www.last.fm." rel="nofollow ugc">http://www.last.fm.</a>  By using a plugin for say winamp it learns your musical tastes and keeps track of the music you play then makes suggestions about what you might like to listen to, it also show you other listeners that are close to your musical profile.  Its fun, lots of statistics, but i'll be sure to check out Pandora as well.</p>
