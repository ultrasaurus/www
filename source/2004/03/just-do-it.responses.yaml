    <p>You said: "Writing English is not like writing code. It's harder (at least for me). There's no compiler. You can't run it afterwards to see if makes sense and feels right."</p>
    <p>True there's no compiler or acceptance test.  But you can ask for peer review from fellow writers.  I have a group writer friends scattered across the country.  We review and comment on each others work, offer suggestions, and help each other get unstuck.  My writer community helps me asnwer the quesions about does it make sense and feel right. (They also tell me when I should just start over.)</p>
    <p>Esther</p>
