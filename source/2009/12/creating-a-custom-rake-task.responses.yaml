- id: 643
  author: "Aravind"
  date: '2011-11-22T07:51:52-08:00'
  content: |-
    <p>Thank you for your post...</p>
    <p>Could you tell me the significance of :environment in :task_name =&gt; :environment. what happens if i vomit this :environment ?</p>
  replies:
  - id: 644
    author: "Sarah"
    url: "https://www.ultrasaurus.com"
    date: '2011-11-22T09:18:48-08:00'
    content: |-
      <p>:task_name =&gt; :environment will load the Rails environment, which will allow you to access things like your ActiveRecord models or Rails config.  Without that you can just run pure Ruby code.</p>
- id: 1490
  author: "Aaron"
  date: '2013-12-04T13:46:21-08:00'
  content: |-
    <p>The latest version of Heroku add "run" to the command. Therefore:</p>
    <p>%&gt; heroku run rake:db:migrate</p>
    <p>instead of:</p>
    <p>%&gt; heroku rake:db:migrate</p>
