- id: 84
  author: "Adam"
  url: "http://moonenbeam.com"
  date: '2004-12-06T22:49:48-08:00'
  content: |-
    <p>If you look at a company called storesonline.com, they help people with online marketing etc. by helping them make e-commerce sites. I got started in it but had a baby... they get fed first...</p>
    <p>Anyway, they have a reverse search engine product which looks at the previous months searches for all 5 of the top search engines not including google... they play their own game - AdWords etc... but if you do a reverse search on say the word halloween in November, it will let you know that in October, there were 4 Million+ searches on that word alone, then it will list in order of searches any other words that were searched with the halloween, like "Halloween costume"... so that way you can see all the other things that people are searching on in regards to your topic. How cools is that.</p>
    <p>Anyway, they also have tools for keyword searches that let you know the websites that use a particular word, how many times it appears in the site and is delivered via e-mail in a PDF file... very good really.</p>
    <p>Now of course there is a fee for such products, but it is very reasonable, if you want to be successful...</p>
    <p>Oh, overture is where you can bid on certain words to make sure you appear in the top of the search engines it supports, do a search on a word and in the top right of the screen click "View advertisers max bids"... and interesting one is CRM... look at how much they pay per click???</p>
    <p>Live long and prosper =:-)</p>
