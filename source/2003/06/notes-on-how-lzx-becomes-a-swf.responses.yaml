- id: 42
  author: "Jason Luka"
  date: '2006-01-16T10:41:21-08:00'
  content: |-
    <p>Okay, to get a straight SWF file:</p>
    <p>Open the editor and pick an edit window.  I usually go 'Laszlo in 10 Minutes' to 'Introduction' to 'Hello World,' just because it's at the top of the list.</p>
    <p>Put your code in and update.</p>
    <p>If necessary, stretch the frame that has your applet so you can see an empty space on it.</p>
    <p>I'm not sure what the protocol for this is in IE, since I only use Firefox.  On the frame with the applet, right-click the empty space and choose 'This Frame' to 'Open Frame in New Window.'</p>
    <p>In the new window, scan the url and erase anything after .lzx.  Also, there'll be a double-slash somewhere in the URL.  Make it a single, then load the new URL.</p>
    <p>You can fiddle with the options a bit, but they're not really worth messing with.  Just click SOLO.</p>
    <p>On the next screen, just click CONTINUE.  There's nothing you need here.</p>
    <p>After that, you have a link to the SWF at the top.  You can save it from there with a real name instead of the garbage IT comes up with.  When you press Continue, it'll give you the HTML code to implement it on your webpage.  Tada.</p>
