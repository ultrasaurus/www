- id: 767
  author: "Grigory V."
  url: "http://floatboth.com"
  date: '2011-11-27T14:00:33-08:00'
  content: |-
    <p>Hmm. Micro instances automatically scale to 2 “elastic CPU units” or whatever they call them when the load is high. I wonder if using Java 7 and a different server would help.</p>
    <p>“ssh -i ubuntu@ec2.pem ec2-” wait, what. Do you mean “ssh -i ec2.pem ubuntu@ec2-”?</p>
    <p>&gt; Ubuntu takes up too much disk space by default to fit into a micro instance<br>
    Micro instances only work with EBS, 8 GB one is free. Ubuntu Server doesn't take that much space.</p>
    <p>Also, you don't *have* to install Amazon's command line tools, you can use the web interface to control instances. And screen isn't cool, tmux is :-)</p>
