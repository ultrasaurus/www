    <p>Sarah, have you heard of the Cabbage Tree Method? There is a book available at <a href="https://www.cabbagetree.org/" rel="nofollow ugc">https://www.cabbagetree.org/</a>.</p>
    <p>Short excerpt:</p>
    <blockquote>
    Imag­ine a bunch of peo­ple in a room, all sit­ting around a table. There are some white­boards in the room, and cof­fee, sticky notes, and maybe even a data pro­jec­tor, lit­ter a table. All of those peo­ple, ex­cept one, share a com­mon prob­lem and they want to cre­ate new soft­ware to solve it.
    <p>But where do they start? There are no de­vel­op­ers here ... what's go­ing on? One of them, the fa­cil­i­ta­tor, steps up and ini­ti­ates a short pe­riod of in­tro­duc­tions and then asks the ques­tion "What is the prob­lem?"<br>
    </blockquote></p>
    <p>It is similar to a customer-driven development, sans the developers; that isn't a great summary, but it is a scenario one could find themselves in, following along with that method.</p>
    <p>Let me know if you have a chance to parse it. ^_^</p>
