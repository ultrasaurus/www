- id: 711
  author: "Malcolm Arnold"
  url: "http://www.rubynuby.net"
  date: '2010-11-06T16:53:22-08:00'
  content: |-
    <p>Hello Sarah,</p>
    <p>Great idea and Ruby Nuby would like to partner with you to make this happen.   Ruby Nuby teaches RoR, entrepreneurial skills and life skills to at-risk and disadvantaged youth who are sponsored by the professionals who take our courses.  They learn alongside each other creating socio-economic bridges. After their 9th grade and completion of Ruby Nuby camp, we place the youths in paid internships/part-time jobs that they work throughout high school.  By the time they graduate, they are hire-able as intermediate RoR developers with 4 years experience.  Companies that hire our graduates have to pledge full scholarships so the youths can work for them during the day and go to college at night getting their degrees.</p>
    <p>Our website is being developed now www.rubynuby.net .  We have been teaching classes at NYU since Aug 9th, 2010.</p>
    <p>Thank you so much for doing this,<br>
    Malcolm Arnold<br>
    RubyNuby01</p>
