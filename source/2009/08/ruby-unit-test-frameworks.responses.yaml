  date: '2009-09-01T05:08:14-08:00'
  content: |-
    <p>You can actually use Test::Unit in RSpec (<a href="http://blog.davidchelimsky.net/2009/2/2/rspec-works-with-test-unit/" rel="nofollow ugc">http://blog.davidchelimsky.net/2009/2/2/rspec-works-with-test-unit/</a>) and Shoulda has some special RSpec hooks as well.  I've found this useful when incrementally transforming Test::Unit tests into RSpec examples.</p>
