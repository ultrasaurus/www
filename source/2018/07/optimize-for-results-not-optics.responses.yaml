    <p>Thank you for this, Sarah.  You remember correctly.  Early on we didn’t have a formal statement of values.  Not sure values brought down from above would have worked.  They came about 6 months in - after we had a sense of what was important to us and had tested it.  I think that’s how the team could align so strongly.   We forged our values in the work and then took the time (a few months in) to argue and push and pull on what we fundamentally believed to be important about our work.</p>
