  content: |-
    <p>The Bill Gates quote is infamously nothing whatsoever to do with Bill Gates.  (For one thing, Microsoft had the 640K limit imposed on them by IBM - it was a PC hardware limit, not an MS DOS thing.)</p>
    <p>Got provenance for the other quotes? They're oft repeated, but never with any verifiable references.</p>
