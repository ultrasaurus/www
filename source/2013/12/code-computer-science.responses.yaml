    <p>Just for the record I don't have a computer science degree :-p . I taught my self computer science through books written by people like Donald Knuth and Richard Stevens. Formal vs Informal education - it doesn't matter as long as at the end of day you actually understand how computers work under the hood. For those people taking pride that they will never have to learn how to write C or ASM, I hope you also take pride that you will go through life having nothing but a shallow understanding of technology and computers. Speaking for my self I rather be a computer scientists who solves REAL problems instead of coding apps compromised of nothing but simplistic business logic written in what looks like pseudo code. It may be difficult for hipster to accept but tools like Linux, chrome, firefox, ruby/php/python interperters, *SQL, you know like all the tools you use everyday to do your job? Are all programmed and maintained by hardcore C/C++ developers. SHOCKING I KNOW.</p>
- id: 4292
  author: "stolzlos"
  date: '2013-12-25T22:42:47-08:00'
  content: |-
    <p>I completely agree with your title. The two things have nothing to do with each other. Yet, I would argue that coding has nothing to do with software development. To code is nothing but to express oneself in a high-level language. It is the content that counts, not the ability that you can express yourself. Being able to write does not make you a writer ... unfortunately.</p>
    <p>I agree with comments that the degree is worthless in the technical sense. You can and should learn by yourself using the available resources instead of being fed the mainstream ideas of software and software development that make so many people stumble and get stuck. Nevertheless it has some worth when you want to get a specific job. As much as I dislike that fact, this has to be accepted.</p>
    <p>Coding is important but only in an absolute sense. Relatively speaking I allow myself that you can actually ignore it. To develop software, that is to truly understand the problem to be solved, the separation into ever smaller sub features, the evaluation of effort and functional risk are always by far more important. Because these things are hardly taught and most of the people are not aware of how important they are, people try to find salvation in ever better coding ... which they will never find.</p>
    <p>Having at least a basic understanding of software development will make people in general actually very wary about coding. They will ignore the noise, not swayed by the hype and only go for the one thing that is important, produce results. It does not matter how.</p>
