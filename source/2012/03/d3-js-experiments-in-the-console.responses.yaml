- id: 793
  author: "Marc Baiges"
  date: '2012-08-06T13:39:47-08:00'
  content: |-
    <p>About your question regarding nested arrays as result of selections, there is a note on <a href="https://github.com/mbostock/d3/wiki/Selections" rel="nofollow ugc">https://github.com/mbostock/d3/wiki/Selections</a> :</p>
    <p>Operating on Selections</p>
    <p>Selections are arrays of elements—literally. D3 binds additional methods to the array so that you can apply operators to the selected elements, such as setting an attribute on all the selected elements. One nuance is that selections are grouped: rather than a one-dimensional array, each selection is an array of arrays of elements. This preserves the hierarchical structure of subselections. Most of the time, you can ignore this detail, but that's why a single-element selection looks like [[node]] rather than [node]. For more on nested selections, see Nested Selections.</p>
