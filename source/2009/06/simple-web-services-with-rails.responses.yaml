comments:
- id: 529
  author: "Tom Rossi"
  date: '2009-06-22T11:51:51-08:00'
  content: |-
    <p>Is there a way to actually do this in your functional test rather than using curl?  In other words, rather than calling:</p>
    <p>post :create, params</p>
    <p>Can we call something like:</p>
    <p>post :create, :xml =&gt; (object.to_xml)?</p>
    <p>That would be nice just so we can jump into a functional test and look at the response.body for debugging.</p>
    <p>Thanks,<br>
    Tom</p>
- id: 530
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-06-22T12:07:31-08:00'
  content: |-
    <p>I absolutely agree that this kind of thing belongs in your test suite.  Thanks for pointing that out.  I'm fond of cucumber for testing this kind of thing (since it also provides docs for the APIs that you could give to another developer).  However, I did this because my tests were failing when they used to succeed and I didn't understand why... it turned out that there was some syntax change in a version upgrade that led to the http header not being set correctly.  In any case, I found that getting back to basics helped me isolate the issue.</p>
- id: 531
  author: "Tom Rossi"
  date: '2009-06-22T12:18:12-08:00'
  content: |-
    <p>This method of testing with cron is definitely valuable!  I was just wondering how I could test (preferably without a plugin).  It would seem like with all the emphasis on REST and on testing, that the framework would make it a little easier to test something like your app responding to an xml post.</p>
