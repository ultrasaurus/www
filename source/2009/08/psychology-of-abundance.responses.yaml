    <p>Sarah -- great post, second paragraph is brilliant.  I had a fantastic time, learned what I needed to learn, and it was a comfortable, fun environment.</p>
    <p>Thanks to you and Sarah Mei for envisioning and organizing the workshop, all of the sponsors, and all of the mentors.  Special thanks to my tutors at the workshop -- Stuart and Jim.</p>
    <p>I've told lots of people about the workshop and everyone is jealous that they didn't get to attend.  Hope you will be holding another one soon.</p>
    <p>I heard about it from the posting on SFWoW.</p>
    <p>Cynthia</p>
