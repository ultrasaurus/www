- id: 207
  author: "Scott Evans"
  url: "http://www.antisleep.com"
  date: '2005-01-04T20:29:06-08:00'
  content: |-
    <p>I like to couple my techno-savvy with an uncomfortable paranoia about losing my work.</p>
    <p>So I have a really simple MT template (in the "archive-related templates" section) that writes XML versions of all my blog entries every time I rebuild the site.  Then I have a cron job at home that pulls down copies of all these files nightly.  So if my server burns down, I'm covered, or if I just switch blog engines, I should have an easy-ish migration path.  (that second part is a lesson learned from my move to MT from a home-grown system: don't throw away the raw data.)</p>
    <p>The template is here:<br>
    <a href="http://www.antisleep.com/templates/backup-all-xml.tmpl" rel="nofollow ugc">http://www.antisleep.com/templates/backup-all-xml.tmpl</a></p>
    <p>And in MT's weblog config/archiving page, I use an archive filename template like this:<br>
    xml/&lt;$MTEntryDate format="%Y-%m-%d"$&gt;_&lt;$MTEntryID zero_pad="4"$&gt;.xml</p>
    <p>The cron stuff is a little more complicated for other reasons but a simple rsync command will do ya.</p>
