- id: 106
  author: "Shirely"
  date: '2005-03-25T22:05:36-08:00'
  content: |-
    <p>Did the StoresOnlines 90min &amp; 8hr. 30$ wkshop.<br>
    Man, I was set to buy their product until last night when I remembered</p>
    <p>ripoffreport.com</p>
    <p>and thought I'd see if anyone had posted on them.<br>
    WOW! 256 at last count.  By government standards, 1 call = 10-15 people, that is 3000 people with issues with this company.</p>
    <p>Kept my money in my pocket.  But was totally bummed when I realized the webtools they paraded were only offered IF you bought.  Not as a courtesy (though, I'd understand if they didn't offer them, they are after all, a business).  But what bummed me was that they never came out and SAID the tools we were all drooling over were only available IF you bought a site.</p>
    <p>So, finding sarahblog and the keyword search made my day.  I'd buy you flowers if I could!</p>
    <p>Buyer beware: subtle high pressure to buy, today only, too good to be true, too easy... and I have to say that they look like a bunch of Mormon kids on mission--no facial hair, really short hair, neutral pants, white or solid shirts with ties that pinch their neck... All they have to do is put the name pin on the other side of the shirt and I'd run screaming from the room.</p>
- id: 107
  author: "Julie"
  date: '2005-03-26T13:06:47-08:00'
  content: |-
    <p>Thanks for this blog. I went to a Storesonline 90 minute seminar and signed up for the 8 hour workshop but, now, after reading the comments, I will probably do my own hunting.</p>
- id: 108
  author: "Karen"
  date: '2005-03-27T11:07:44-08:00'
  content: |-
    <p>I wish I had known how to do due diligence before I signed up for StoresOnline. Fortunately for me, I didn't have $6,000 or less and took out a loan for 18% with them, which should have told me something, but I felt desperate to generate an income as I am in my 60's and very poor. I had to close my bank account to protect myself. One of the reasons I went with the program is that I thought Mormons were ethical. Not these guys. This is a finely tuned scam. In business 11 years? well then the customer service should be perfect. Not able to get a password established easily but you have coaches who call say they can help you with everything? The coaches by the by live just 3 miles away but Storesonline doesn't have any connection? Yeah, Right. Feel like your frustrations just reflect your inexperience and inadequacies and someday you'll get it going? Believe that if you just keep trying you'll make money without costly advertising and investing in per clicks? Feel like you've been taken but its your own fault? Nah, this is a scam. Don't let your ego make you think its your fault. These guys have been at it for years. Any time you discover a business that had to reinvent itself as in from iMerchant to StoresOnline, then heed the warning signs. There are many sad unforunate aspects to a situation like this for large number of people who are taken in by the youthful friendly high-hype atmosphere. For me, these people are crooks and they get to ruin my credit because I refuse to pay them $4,000 for a product and a service that was not only misrepresented but lied about. They need to be put out of business.</p>
- id: 109
  author: "Anoymous"
  date: '2005-04-02T04:28:41-08:00'
  content: |-
    <p>Hi, I'm from Malaysia and I've just attended the 1 day seminar by Stores Online 2day. I was so excited by their talk and wanted to purchase their services. Unfortunately I din have that much money to spent.It was RM 18 000! Is it true what u guys are writing here? There was really a lot of people signing up. They really gave a very convincing talk today.</p>
- id: 110
  author: "Anonymous"
  date: '2005-04-02T20:37:21-08:00'
  content: |-
    <p>I'm from Malaysia too. Paid RM 18,700 (abt USD 4,900) for the 6 websites package yesterday, 2nd April 2005. While I applaud them for flawless organisation for the seminar, which I paid RM 150 (abt USD 39.50) to attend, I did not like the idea of them lying to us that the 'reverse search' engine is unique to Storesonline.com.</p>
    <p>First thing this morning I went in their merchant page and tried out the 'reverse search' engine, and could not get the page uploaded. Then I googled for 'reverse search engine' and found this page. When I click <a href="http://inventory.overture.com/d/searchinventory/suggestion/," rel="nofollow ugc">http://inventory.overture.com/d/searchinventory/suggestion/,</a>  I get the same failure message that I got when accessing through Storesonline merchant page. Hence proving that they lied to us at the seminar!!!</p>
    <p>I have just asked my credit card company to block the payment. I will be sending them back the introductory package. Lucky for Malaysians, they could not process the credit card payment onsite due to the large amount (RM18,700 is a BIG sum here) and could only clear the payment when they return to the US.</p>
    <p>Thanks a million to Sarah for putting this blog and Aaron, Shirley, &amp; David for highlighting the scam on 'reverse search'. You guys just saved me RM 18,700!!</p>
- id: 111
  author: "andy"
  date: '2005-04-02T21:10:53-08:00'
  content: |-
    <p>I went to stores online seminar in Malaysia too. I felt something fishy about the whole sales pitch and a reverse search engine that solely belongs to a company. The reason they try to get you to take the "only today offer" is so that you wont go back and find websites like this telling you that you made a mistake. I am glad for those who paid credit card which you could cancel before it is processed; that is if you know it before it is too late.Not too good news for those who paid cash.They did put up a quote by mark twain saying the only regret you will have 20years from now is the things you did not do 20 years ago. I have heard an advice from a marketing expert who is councilling 10 millionaires who went bankrupt. He was amazed to find that all of them had one character in common; they never missed an offer that knocked at their door.</p>
- id: 112
  author: "Sarah Allen"
  url: "https://www.ultrasaurus.com"
  date: '2005-04-03T13:49:06-08:00'
  content: |-
    <p>I'm glad so many people have found this posting useful, particularly in allowing people to avoid an apparent scam by the folks at StoresOnline.</p>
    <p>However, there isn't much new info being added anymore, so I'm going to close comments on this page.  Feel free to send me a note from the feedback link on the main page.  If you want to thank me, make a donation to your local public school :)</p>
    <p>Good luck everyone!</p>
