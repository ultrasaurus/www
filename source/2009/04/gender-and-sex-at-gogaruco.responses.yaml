- id: 415
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-04-21T08:36:30-08:00'
  content: |-
    <p>Erik,  my guess is that the number of women at the conference does reflect the Ruby community as a whole (although I don't have any stats on that).  Assuming my numbers are correct 6/200 is 3%.  That is an interesting number.  I've heard of two studies which each report the number of women contributing to open sources projects at 2-3%, far lower than the 18-20% number that I generally hear for women in CS/IT.</p>
    <p>I think women are less likely to experiment with new technology just for fun and their volunteer efforts tend to be focused on the local homeless shelter or PTA activity than the traditional open source "scratching an itch."  Women typically have less free time than their male colleagues and gravitate toward large companies who have good benefits and HR departments.  Also, although the majority of small businesses are run by women, the majority of tech companies are still started by men.  If you are starting a company, you want your closest buds who you trust the most on your core team -- those are likely to be folks of your same gender.  Ruby tends to be used more in startups than in larger, established companies that have more inertia around their technology choices.</p>
    <p>All that said, I think this is a good moment to reach out to women in tech and introduce Ruby to a wider, more gender-balanced audience.  With some focused outreach efforts, I think we could have much better balance at the conference next year.  And if anyone reading this is working in a group with 4 or more men, see what you can do to make sure your next hire is a woman.  Maybe the best candidate doesn't know Ruby yet.  At least make sure you interview a few women, before making a hiring decision.</p>
- id: 416
  author: "Matt Aimonetti"
  url: "http://merbist.com"
  date: '2009-04-22T09:04:31-08:00'
  content: |-
    <p>@sarah  thanks for your honest feedback. Outside of my wife who helped me prepare the talk and Leah who was working on GoGaRuCo, this is the first female feedback I have gotten. Leah said she talked to most women at the conference and nobody mentioned my talk but I can see how you could be offended by the topic.</p>
    <p>You seem to mention that your problem with my talk was the amount of "racy" content in my talk. I did remove 3 slides that I quickly flashed (0.5s) during the talk, none of which could be defined as actual porn. So out of 82 slides, maybe 5 could be considered "risqué". It's true that I did not have any live coding session but I don't think you can say my talk was not technical and I did not focus on CouchDB.</p>
    <p>I'm also surprised you are linking to my slides if you think they were so inappropriate.</p>
    <p>Again, I'm not trying to be insensitive, but the title of the talk was very clear,  it was submitted to the audience by the GoGaRuCo organization, the audience chose the talk.</p>
    <p>I personally don't believe the talk was sexist and none of the pictures I chose would show more than what you would see in a regular movie on TV. <br>
    However, I do care about my audience, and next time, I will think twice before doing this kind of presentation in the US.</p>
    <p>- Matt</p>
- id: 417
  author: "Seth Thomas Rasmusse"
  url: "http://greatseth.com"
  date: '2009-04-22T10:28:13-08:00'
  content: |-
    <p>I think the worst part of it was just that he didn't know when to leave the joke alone. Just bad comedic timing.</p>
    <p>None of the imagery would have been off limits for some sectors of good ol' network TV. It's kind of unfair to make this about porn when none(by most standards) was shown. And let's not forget: we were all free to walk out during this presentation.</p>
    <p>I don't think this is relevant to any discussion about the state of women in the industry or anything like that, either. Men were uncomfortable and/or offended, too. Maybe people would have felt better with some gay porn stars mixed in?</p>
    <p>It would be unfortunate if the imagery from this presentation were censored for further reproduction. It would speak poorly to the maturity of our community and its respect for free expression.</p>
- id: 418
  author: "Leah Silber"
  url: "http://www.gogaruco.com"
  date: '2009-04-22T11:16:20-08:00'
  content: |-
    <p>Hi Sarah,</p>
    <p>Great to see you this weekend!</p>
    <p>3% is, I'm pretty sure, above average attendance for females at Ruby shows. We can all wax on about why women do or don't program in Ruby, but I'll certainly say that it's not because there's a problem with the men. All members of the community go out of their way to make anyone and everyone feel welcome, and they deserve a lot of credit for that.</p>
    <p>As for Matt's presentation, I'll say this: we do not censor or pre-approve speaker content in any way. Thus far, it's just not been the Ruby conference way, and as someone who is vehemently anti-censorship, I think that's the *right* way for things to be. That means that there's sometimes room for a lame or tacky talk to sneak in, but more often than not, it means people surprise us with great news, stats and techniques on stage.</p>
    <p>I think Matt got everyone's message loud and clear, and applaud him for working on a new version of the slides for those interested in the metaphor-free content. I didn't find the presentation particularly offensive myself, but respect the opinion of anyone who did.</p>
    <p>What I *don't* like are the few folks (and I'm NOT talking about you here) expressing extreme moral outrage and raising a massive fuss everywhere they can. Matt got the message, it's been noted, and there's nothing left to do: take a deep breath, and stop calling everyone in your rolodex :P We're just a small group of Rubyists driving ourselves batty in an effort to give back to the community. Sometimes there are hiccups -- it happens, we human and we get it, move on.</p>
    <p>Sarah -- you chose to write this post, so it was obviously a source of irritation to you, and that sucks, but what I'd *really* like to see is more on the content of the rest of the show. Your other posts were great and I'm sure everyone would be interested in any other observations you had on any of the technical content. Perhaps Matt's talk shouldn't be your primary source of info, but I'd love to hear more about your thoughts on CouchDB and anything else :)</p>
    <p>Thanks again!</p>
    <p>-- Leah</p>
- id: 419
  author: "knowtheory"
  url: "http://blog.knowtheory.net"
  date: '2009-04-22T12:34:23-08:00'
  content: |-
    <p>First: I find the gender inequality in the Ruby community both profoundly frustrating, and profoundly disturbing.  It is a subject i am concerned about as a member of our species, and as someone who has never had an opportunity to discuss ruby development with a female peer.</p>
    <p>=============================</p>
    <p>There are some things I am curious about.</p>
    <p>The ruby community fails to do two things (in so far as it is concerned with gender equality at all [which near as i can tell, it does not]), the first is recruit and reach out to women in tech and tech related fields, and the second is to make an effort to retain &amp; promote gender balance.</p>
    <p>This discussion falls into the later category (i.e. alienation).</p>
    <p>I understand viscerally that this was alienating.  What i'd like to ask is what could have been different about it (besides to have totally phrased the analogy differently), that would have made Matt's presentation less alienating.</p>
    <p>One thing my wife and i noted about the slideshare reel that there was really only one risque image of a naked man (Dr. Manhattan) in the censored reel... if there had been a better balance would it have been just as alienating?  If yes, would it be because of the gender balance (or lack thereof) at the conference?</p>
    <p>(The point of this isn't merely academic.  We all have a sense of propriety, the question is where should the line be drawn, and upon what factors that depends.  This is a practical question too, for people who are pushing the boundaries for their presentations, which personally i don't think is a bad thing if executed successfully.)</p>
- id: 420
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-04-22T17:49:45-08:00'
  content: |-
    <p>Matt,</p>
    <p>Thanks for dropping by and adding a comment.  In the US, we might call some of the images "soft porn" (notably the blow-job shot in slide 8) but most were just sexy women.  Personally, I wasn't offended by the images themselves, but by their context.  I think you picked fairly tasteful and sometimes funny images.  I don't mind having images of sexy women and implied sex acts on my blog.  I mind seeing them in the context of a tech talk!</p>
    <p>I wouldn't call your talk sexist, but I do believe that it was inappropriately sexual.  It was also overwhelmingly heterosexual, which can also alienate folks.</p>
    <p>As I said, if you had left it as a few intro jokes, that cleverly related to the content of the talk, that would have been fine with me (although there may be other people who would have been uncomfortable with even that).  Mostly, I found it hard to concentrate on the code examples since I kept waiting for the next sexy lady to flash by.  I think it would have been distracting for any audience, not only in the US.  If you care about conveying your message and making your talk memorable for its technical content, you should skip the sexy pics in any country.</p>
    <p>Sarah (<a href="http://twitter.com/ultrasaurus" rel="nofollow ugc">@ultrasaurus</a>)</p>
