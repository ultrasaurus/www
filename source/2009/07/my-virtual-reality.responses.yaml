  content: |-
    <p>We could start holding RailsBridge Board meetings in Second Life. That'd be even more confusing. (There is a SL Ruby Users Group, too, though I haven't checked in to see what they're up to for well over a year).</p>
- id: 558
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-07-10T04:22:18-08:00'
  content: |-
    <p>I think that meeting in a virtual spaces somehow might have felt more "real," but that kind of VR is deceptive.  I agree that it would make it even more confusing.  In spaces like Second Life, you get real world-like, gestural cues that, I believe, increase a sense of trust.  Whereas in the blogosphere/twitterverse veracity is naturally suspect; however, you see such frequent glimpses of human imprint that deception is as difficult as it would be in person.</p>
    <p>This line of thinking has led me to reflect on the old essay <a href="http://loki.stockton.edu/~kinsellt/stuff/dibbelrapeincyberspace.html" rel="nofollow ugc">"A Rape in Cyberspace"</a> and how, by interacting on our own terms, via blogs, twitter, email and IRC, we innoculate ourselves from such an invasion.</p>
