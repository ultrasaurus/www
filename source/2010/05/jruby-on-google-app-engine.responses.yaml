    <p>I've chosen to use Rails on App Engine  I think its' definitely the future.<br>
    <a href="http://www.muhadib.com" rel="nofollow ugc">http://www.muhadib.com</a> is one of the project's I've put on app engine (using the twitter api).<br>
    it's not alway smooth sailing especially when trying to use GEM that don't support it.</p>
    <p>The Guys at google and outside that are running this effort are amazing and i'm sure the Rails Community will eventually choose this as a default way to get a site up.</p>
