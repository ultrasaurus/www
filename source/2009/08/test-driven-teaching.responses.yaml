  author: "Yehuda Katz"
  url: "http://www.yehudakatz.com"
  date: '2009-08-23T21:51:51-08:00'
  content: |-
    <p>Matt Aimonetti and I taught a course on Merb in Phoenix earlier this year (January) using tests for teaching. We would introduce each new section with some tests, and ask the students to try to make them pass. It was extremely successful, because the students weren't just trying our some hypothetical new technique, they had red/green to determine whether they were successful.</p>
