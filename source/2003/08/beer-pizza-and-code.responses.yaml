    <p>Nifty tree app -- the timing on the animation seems just about right.  The dissolve/collapse is quick enough not to interfere with the next mouse motion.</p>
    <p>On the other hand, I dispute the notion that the +/- is the best way to enable expand collapse in a tree widget.  See my take at "redefining the tree" in the  name link.</p>
