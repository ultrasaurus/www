  content: |-
    <p>Interesting use of words here:</p>
    <p>"it may have been the first time such applications of technology were expressed in the popular press"</p>
    <p>As I was reading what appeared to be a homage to "the great thinker and inventor", I was more impressed with the fact that Vannevar's articles made it into the popular publications of the day than I was by the content of those articles.</p>
    <p>Begs the question, what's more important - the person with the thoughts and ideas, the person who got those thoughts and ideas "expressed in the popular press", or the person who develops businesses based on those thoughts and ideas?</p>
