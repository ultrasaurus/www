    <p>Wonderful information. I always thought that filtering out unwanted content was just the job of a heartless system.<br>
    It's calming to know people with a heart, programmed that system.</p>
    <p>I totally agree that the computer has given everyone the notion that technically 'no one' is on the other side. Yet our notions of whether someone IS on the other side, and how worldly-knowledgeable we need to be, keeps shifting from case to case.</p>
