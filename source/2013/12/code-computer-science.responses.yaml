- id: 3210
  author: "Yamada"
  date: '2013-12-23T18:46:53-08:00'
  content: |-
    <p>I'd say the bigger issue is that academia is different than knowledge (or though for that matter). For me it seems to mean, while a formal education can obviously be a great thing, that it's not mandatory to be a good engineer/computer scientist. Most of all, even the best education won't guarantee anything.</p>
    <p>Some people benefit from it, others have methods which work better for them and my impression is a considerable amount of people actually are held back by the academia - and I mean the fundamental aspects of it, those which are inherent to the institutionalization of education.</p>
    <p>That being said and though I don't mean to disagree entirely with you, there often seems to be this almost defensive idea, whenever "learning to program" reaches the mainstream, to preserve the community's "seriousness" with comments as yours. The learning process is something that happens organically and very differently for each person. There should be no undermining of this process simply because the formalized idea of it expects there to be a stage 'a' or 'b' towards reaching expertise.</p>
    <p>Cheers. (I'd rather have this discussion on twitter or some other platform, if you want. @yamadapc )</p>
