    <p>in my art exhibitions in paris, on the future of modeling, i said that it would not be enough anymore for models to just be objects of beauty. i said in the future they would become fully integrated beings of body mind and spirit and become role models to the younger generations ripping their pics out of the magazine and putting them on the wall to emulate. the role of supermodel is a very important role in society, as it is often the first contact many women have with female icons. i like to use my visibility as a model to give a posotive influence not only to other women, but of the power of the human spirit.</p>
    <p>great article!</p>
- id: 226
  author: "Cort"
  url: "http://www.notebookmargins.com"
  date: '2005-07-04T13:37:20-08:00'
  content: |-
    <p>Hi Sarah,</p>
    <p>I really liked this piece. It's definitely a big help to have good role models. When I was getting my ms in computer science it was the notion of being like some crazy haired scientist from a b-movie with a strange accent who gets to build robots and travel in minature submarines through a person's body that helped motivate me during the tough points.</p>
    <p>My four big role models have been my mother, my father, Harvey Pekar and one of my grandmothers.</p>
    <p>My mother taught me how to be a workahaulic. My father taught me how to relax and waste time properly. Harvey Pekar taught me how you can do something great in your free time, regardless of what the job of the day is. And my gram taught me how to just see life as one big entertaining story, where peoples strenths and weaknesses are all just a part of the big joke.</p>
    <p>I'm still a bit confused on the whole work life, personal life balance thing, partly as a result of being in this industry and partly because I'm just that way. Life is good though. Thank you for your story.</p>
- id: 227
  author: "Alexandra Lei"
  date: '2005-07-12T23:01:48-08:00'
  content: |-
    <p>Hi, Sarah<br>
    When I'm surfing for something wonderful in laszlosystem.com, I found your article.  Your story and your feeling(esp. the beginning part）are exactly what I have now as a novice female programmer in China. I fell in IT world by accident, but soon I found that I really like coding and somehow be good at it.  But when I took it as my major in Master study, headache appeared.  Doubts intruded in my life as my first team project was assigned.  Conventional beliving like "girls cannot code", "girls will delay" or "girls never know software spirit" killed me everytime a team work assignment was set. I've never thought of how hard it would be to join a team as a developer rather than a tester or a document writer.   These doubts grow so strong when people gossip about what a black-sheep role some girl played in some well-known scientific lab. Stories about how a girl makes ridiculous dead-loop or how girls cried after they made a big mess when they deal with complicated algorithm entertained almost every IT insiders, students and professors.(Worst of all, when the entertained students growed to be professors, they take these to amuse their students too, which makes these story believable and classic tale!) These poor anonymous, maybe also fictitious, girls together set a huge villain model for female IT players in China.</p>
    <p>When I started a real job as intern, I finally learned what they say about "the doubt became real and tangible", especially doubts from bosses. According to a national wide investication, feeling being under-estimated and ill-treated are the most common sense of female programmers all over China.  But there is nothing to complain.  On the contrary, I feel lucky to be in IT.  Because in this world, the advantage is relatively describable and comparable(I think this point is what coding over art).  All I need to do is make the advantage prominent enough. So I took part in national programming competitions, expecting something good can be given upon the good ideas and hardworks.  Now I have reliables partners who were my former colleagues and classmates.  Although they have doubts too, I'm so grateful to the trust they give me so that we can fight together.</p>
    <p>Career is supposed to be the flask, in which one can finally distill her best. Role models? Yes, they tell you what you may expect from the distilling, but not simplify or guarantee this in any way.  It takes long to form a role models.   Succesful stories are good donation to accelerate this process.  Hope we won the national prize! So that I can donate a bit myself too. Btw, guess what tech we take? Surely Laszlo! :)</p>
- id: 228
  author: "Sarah Allen"
  url: "http://www.ultrasuarus.com"
  date: '2005-07-16T17:24:29-08:00'
  content: |-
    <p>Alexandra,</p>
    <p>Thanks for taking the time to share your story.  I'm glad you have found reliable partners who trust you.  I wish you success in the programming competition!  Even if you don't win, you will learn a lot by taking the initiative and completing the project. I agree that having role models does not guarantee success, but I do believe it simplifies my thinking when I can learn from someone else's success.  There is no substitue for believing it is possible.  Hang in there at work and keep at it.</p>
    <p>All my best,<br>
    Sarah</p>
- id: 229
  author: "Tina Jo Cantor Toomey"
  date: '2005-07-17T08:53:23-08:00'
  content: |-
    <p>Hey Sarah,<br>
    We know each other from our time at Brown together; me struggling to manage Andy's correspondence, etc., and you TAing for CS11. Hello again!</p>
    <p>I really enjoyed your discussion about role models. I've yearned for role models of any kind. As a teenager of the 70s with a mom and dad caught up in rapidly changing times, and as the youngest of four, I was neglected; Any role models that entered my world would have to work hard to break the dispassioned and insecure shell I created to survive it. I've struggled and still struggle today.</p>
    <p>However, today, my mom is my role model. I marvel at her courage. In 1997 my father died, and my mom became a matriarch. She did so with grace, grace and more grace. I'm so pleased to finally get to this place in my relationship with her.</p>
    <p>In my heart of hearts I'm an artist, and so added to my list is Judy Silvan, a longtime friend. She has created a home full of color and style for herself and son and she generously shares it with her friends. Together she and I create buckwheat hull pillows for sale. I love this project creating beautiful art. I learn from her all the time.</p>
    <p>Anybody that demonstrates courage is my role model. Frank McCourt author of Angela's Ashes became an instant hero for me.</p>
    <p>Thank you Sarah for creating this venue to become acquainted with you again. May you continue to be blessed.<br>
    Love,<br>
    Tina</p>
- id: 230
  author: "Sarah Allen"
  url: "http://www.ultrasuarus.com"
  date: '2005-07-17T12:17:20-08:00'
  content: |-
    <p>Tina,</p>
    <p>So, wonderful to hear from my long lost friend.  When I wrote this, I was focused on role models in the context of work and technology.  It is good to hear about your role models for other parts of your life.</p>
    <p>One of my role models as a mother and just as an all around human being is my husband's mom, Isabel Allen.  She created around herself an amazing extended family, readily adopting the best friends and loved ones of her children.  When Bruce and I got married, she said she was delighted to have another daughter.</p>
    <p>Thanks for finding me and sharing your stories.   I look forward to getting back in touch.</p>
    <p>Love,<br>
    Sarah</p>
- id: 231
  author: "Kim Hansen"
  url: "http://www.transformativedesigns.com"
  date: '2005-08-19T10:18:32-08:00'
  content: |-
    <p>Thank you for you story.  It is crucial for people to hear and tell stories, to share complex information on an emotional level.   We are wired to learn from stories and this capacity is under-utlilized in teaching and learning.  As an instructional designer  I'm always looking for a good story to share with others, hook them in, and get them thinking on deeper levels. This is especially crucial in e-learning.</p>
    <p>To quote Kipling -<br>
    "If history were taught in the form of stories it would never be forgotten"</p>
    <p>...and, I think, neither would complex or technical information.</p>
    <p>Kim</p>
