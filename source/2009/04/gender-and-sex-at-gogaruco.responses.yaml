    <p>It's not about whether the images 'could be considered “risqué”', or whether you could see the same thing on network TV. It's about context.</p>
    <p>I can see depictions and dramatizations of racism on network TV at any time of the day (including children's programming). It would nonetheless be inappropriate for me to give a detailed, technical talk about red/black trees if the red nodes were illustrated with Indians in feathered headdresses trading wampum for scalps, and the black nodes flashed gang signs and ate watermelon and fried chicken.</p>
    <p>Get it?</p>
- id: 430
  author: "amy newell"
  url: "http://thirdbit.net"
  date: '2009-04-24T12:52:42-08:00'
  content: |-
    <p>I wasn't at the conference, but I am a woman ruby developer, and I ended up seeing the slideshow after DHH tweeted approvingly about it. Since then, it's frankly been bothering me a lot, more than I would have expected it to.  I've been a ruby developer involved in the Boston Ruby community for over 2 years now, and I'd like to echo other commenters who have said that this presentation is not at all the norm in the ruby community as a whole.  My male colleagues are overwhelmingly respectful and appropriate and great fun to work with and talk code with, and not in a censored, uptight, overly formal, hyper-professional, afraid-of-getting-sued way.  The first time I attended the Boston Ruby group, I had a (very quiet) 3-month-old with me, and I sat nursing her discreetly in the very back row with nary a raised eyebrow.</p>
    <p>But I think that's precisely why I find myself so bothered by those slides, and by what I've read of Matt's response to criticisms of them, and by DHH's twittering approval of their style. With the coming merger of ruby and merb, and the increasing importance of rails in ruby development generally, Matt and DHH are very real leaders of the ruby community.  I think the ruby community had a good start, with the whole Matz is Nice and So We Are Nice (minaswan) slogan of the early days. But norms of behavior do evolve, and when there are very distinct leaders of a community, the norms tend to evolve in their direction. So when I see community leaders doing and condoning things that I don't think we need to see more of, it doesn't quite seem like enough to just agree to disagree. I don't want my beloved ruby community to become a woman-unfriendly place, and if very important people in the community are the ones leading the way, then the rest of us, not-so-important people, have to fight extra hard to keep it from happening.</p>
    <p>Leah, you wrote above: "I think Matt got everyone’s message loud and clear. [ ... ]<br>
    What I *don’t* like are the few folks (and I’m NOT talking about you here) expressing extreme moral outrage and raising a massive fuss everywhere they can. Matt got the message, it’s been noted, and there’s nothing left to do.."</p>
    <p>I wish I could agree with that. Like Julia, above, I don't really get the sense that Matt did get everyone's message loud and clear.  If he'd said, simply "Hey, it was a bad call, I didn't intend it that way but I'm really sorry about it," then okay. But there's a fair of amount of self-defensiveness in his responses to the criticisms. He points out that the title of his talk was approved in advance, that his wife said the talk was fine, that the content isn't racier than TV, that people have different ideas about what's acceptable conference content,that only 5 slides could be considered risque, that he personally doesn't consider the talk sexist and was just trying to be entertaining and make a joke. There's very much a sense of "oh, don't take things so seriously" and not much of an effort that I can see to understand why people might take things so seriously. Like, no sense of history.  I'm also concerned about how DHH piled on and publicly approved of the style and content of the presentation. If he hadn't, then fine, maybe I'd agree, there's nothing left to do. But obviously there _is_ something left to do.</p>
    <p>I mean, honestly, I thought my mom had done all that for me, and I could just sit back and enjoy a wonderful post-feminist world, so I guess I'm kind of pissed off that that turns out not to be the case. "all of this has happened before, and all of this will happen again" and it just makes me so damn tired.</p>
    <p>I understand that the ruby community prides itself on its un- or anti-professionalism. But some professional norms exist for very good reasons: because they make it easier for people of different backgrounds and life experiences to come together and work productively and respectfully. One doesn't have to be an uptight square to suggest that aggressive displays of sexual content at programming conferences perhaps decrease, rather than increase the ability of those attending to learn and focus on the technology itself. Titillation is certainly good marketing, but frankly, if you can't find a way to make your presentation interesting that doesn't include thonged asses, your presentation isn't interesting. Not everyone responds to tits and ass, but everyone can respond to honest, creative, intelligent command of the material and eagerness to share it.</p>
    <p>sorry for such a long comment, thanks for the blog post giving me a forum to write it.</p>
    <p>amy <a href="http://twitter.com/amynewell" rel="nofollow ugc">@amynewell</a></p>
