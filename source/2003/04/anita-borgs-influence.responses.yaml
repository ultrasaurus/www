    <p>I first heard Anitas voice in a hotel lobby in Paderborn Germany,she was staying there with her 2 cats!! nothing was ever ordinary with Anita.<br>
    I was over from England doing a photography job,desperate for an english voice with a sense of humour,and Anita certainly had that,we hit it off straight away both with a keen sense of the unusual and as much fun as we could muster.From that moment on Anita was my best friend and mentor,we would meet in different countries indulging in gorgeous food swapping stories.<br>
    Anita often gave me a helping hand,once when I got stuck in Singapore and again when I needed to go to Stockholm.<br>
    Anita was my soul mate,<br>
    I will really miss you my friend<br>
    my loss is gods gain, love you x</p>
