    <p>Thanks for the article Sarah! It's great to hear from someone who's been actually "using" the technology. I went to the East Bay Ruby and Adam (above) gave a very compelling overview of his technology. Having went from knowing nothing about Objective C &amp; Cocoa to building a Timesheet/Expense tracking productivity application earlier this year, the idea of "ramping up" on Android, Blackberry, etc., terrifies me! Perhaps, when the time comes (which may be soon), I'll give Rhodes a try and see if I can roll out my project with success. My current project is very Javascript'ie - CSS intensive so it may be a perfect fit. Thanks again for the 411 Sarah!</p>
