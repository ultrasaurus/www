  url: "http://pt.withy.org"
  date: '2009-05-29T06:32:15-08:00'
  content: |-
    <p>Here's an interesting question to ask kids (who hopefully have no preconceived notions):  How would you sort colors?  Give them a bunch of colors and ask them to put them 'in order'.  Next time, throw in some colors that vary in intensity or brightness and ask the same question.</p>
    <p>Obviously, there is no right answer.  But it might be amusing to look at the rgb values of the colors after they are sorted to see if there is a pattern, and then to talk about other ways of describing color...</p>
