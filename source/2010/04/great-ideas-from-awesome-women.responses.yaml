  content: |-
    <p>Hi Sarah, congrats on all the progress you've made bringing more women developers into the Ruby community. It seems like there are more women interested in and skilled at Ruby/Rails now than ever before.</p>
    <p>I haven't yet seen too many women entering the Ruby workforce outside of the main Ruby consulting companies though. I'm not a recruiter, but I'm currently tasked with hiring a new in-house Ruby/Rails dev for our engineering team here in SF. It would be great to add to our team's diversity, but I'm not sure where to go about looking. Do you have any advice for those of us on the hiring end?</p>
    <p>Keep up the great work!<br>
    Rob</p>
