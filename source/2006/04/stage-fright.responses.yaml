  content: |-
    <p>Of course there's no substitute for preparation. And always do a run through with the demo equipment once before the talk in its final configuration (I'm always amazed at the number of people who expect it to "just work").</p>
    <p>But what I find very useful is, once the talk has started, to "sink into the moment." Rather than trying to get through it quickly, which is the natural tendency, pause for a moment at the beginning, slow way down, and tell yourself this is all there is, where you are right now, what you're doing right now. I get the same feeling when I do Tai Chi (if I'm doing it right).</p>
