  content: |-
    <p>Combining regular expressions with email archives and speech synthesis can be a fun way to recall the past, and reflect on aspects of one's personality or relationships with others.</p>
    <p>I wrote a little app a few years ago that would read aloud all self-referential statements from my email archives.</p>
    <p><a href="http://woj.com/whispers/" rel="nofollow ugc">http://woj.com/whispers/</a></p>
    <p>It's a very solipsistic art app, but the point is that there are some interesting interaction possibilities when you intersect a few powerful tools.</p>
