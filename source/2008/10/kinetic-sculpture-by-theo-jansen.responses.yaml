    <p>Hi Sarah-<br>
    Beautiful post.<br>
    Because yesterday was Memorial Day, I thought I would suggest looking at the Kentucky Vietnam Veterans Memorial, which is another example of the interface between engineering and art:<br>
    <a href="http://www.helmr.com/ky.htm" rel="nofollow ugc">http://www.helmr.com/ky.htm</a></p>
    <p>It is a sundial with the names of the 1103 soldiers lost during that war, arranged such that the shadow of the tip of gnomon (which is what the pointer on a sundial is called) touches the person's name on the day of his death each year - a reference to our individuality, our collectivity and our place in the universe.</p>
