    <p>Heh.  My son's gone through the same curve, more or less, and I have had similar experiences to your own.  The only difference is that his little brother will get into the act as well.</p>
    <p>It definitely helped his math skills, and he's developed some interesting and semi-creative ideas for monsters and spells and such.  He makes Yu Gi Oh movies in his head, and plays them out with toys and such.</p>
    <p>Thanks for the post.  It's good to know I'm not the only one out there.</p>
- id: 252
