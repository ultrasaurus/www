- id: 708
  author: "Matt Reider"
  url: "http://engineyard.com"
  date: '2010-10-20T20:49:37-08:00'
  content: |-
    <p>Hey Sarah! I know I said this to you a couple of weeks ago - before I returned to technology, in 2003, I gave secondary school teaching a whirl, and taught Biology for a bit in San Leandro (CA).  Based on that experience, and some of the volunteering I did in the Berkeley Unified School District teaching digital video editing to young children, I would be happy to help you deliver and organize whatever class you end up teaching.</p>
    <p>Some opinions...</p>
    <p>Forty-five minutes to an hour and a half is about right for each lesson, and I would say two lessons a day max. The other time would be spent applying whatever they learned in building something meaningful.</p>
    <p>The Arduino idea sounds PERFECT, in that you could show something, at the beginning, which is a finished piece of work, that the kids could get excited about. They could also make it very personal, so each student could take some time to plan what it is that he or she would like to build, based on an interest, or something relevant to their lives (Dewey: "Text without Context is Pretext").</p>
    <p>I also like that Arduino involves something more than computers. It shows that these skills can be applied to anything that has a chip.</p>
    <p>Awesome idea!</p>
