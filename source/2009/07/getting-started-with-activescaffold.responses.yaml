- id: 542
  author: "Rupak Ganguly"
  url: "http://rails.webintellix.com"
  date: '2009-12-11T00:42:02-08:00'
  content: |-
    <p>Nice comparative post, Sarah. I noticed that there is a slight typo in the line:</p>
    <p>Create app/controllers/task_controller.rb:</p>
    <p>which I believe should be:</p>
    <p>Create app/controllers/admin/tasks_controller.rb:</p>
    <p>Notice the folder "admin" where the controller should be along with the plural naming convention.</p>
    <p>Also, for Windows users, if you are having a tough time installing the active_scaffold plugin from Git, checkout the tip in my post at <a href="http://rails.webintellix.com/index.php/2009/05/installing-rails-plugins-from-github-on-windows/" rel="nofollow ugc">http://rails.webintellix.com/index.php/2009/05/installing-rails-plugins-from-github-on-windows/</a>.</p>
