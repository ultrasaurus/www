- id: 56
  author: "Oliver Steele"
  url: "http://osteele.com"
  date: '2003-08-05T14:37:46-08:00'
  content: |-
    <p>In Italian, "c" is pronounced [ʧ] (English "ch") before "e", "i", and "y", and [k] before any other letter — including "h", which is otherwise silent.</p>
    <p>This means that "ce" would be pronounced [ʧɛ], and "che" is pronounced [kɛ]. This is the opposite of English, and took us a while to get used to last month while we were in Italy.</p>
    <p>(There isn't actually an Italian word "ce", but there is a "che".)</p>
- id: 57
  author: "MALTP"
  url: "http://www.maltp.com"
  date: '2003-09-18T13:46:48-08:00'
  content: |-
    <p>Actually, the rule for Italian is easy to remember. Before "i" or "e" (soft vowels) it's the English "ch" sound, and before "a" "o" or "u" (hard vowels) it's the English "k" sound. To get the English "ch" sound before a hard vowel, you throw an "i" after the "c" -- like "ciao". To get the "k" sound before a soft vowel, you throw an "h" in -- like "chianti". There's one quirk: if there's an "s" before the "c", it's an English "sh" sound if it's followed by a soft vowel, and an English "sk" if it's followed by a hard vowel -- "prosciutto" and "scampi".</p>
    <p>This is the same for "g" ("spaghetti", "Giovanni", "gorgonzola" etc.). There's no "s" quirk with "g", but there is an "l" quirk: before a soft vowel, "gl" is pronounced sort of like an English "y" sound.</p>
    <p>In Lojban, the "c" stands for the English "sh" sound.</p>
    <p>And if your son decides that English spelling is stupid (and it is), have him check out Shavian, an alternate phonetic alphabet for English commissioned by George Bernard Shaw.</p>
