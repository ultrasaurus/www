  date: '2009-04-29T18:51:01-08:00'
  content: |-
    <p>I'm a Chicana (ahem, Hispanic female), and I know that I have to work 10 times harder than every other developer. It's hard to work on things when you feel like you're at the bottom of the totem pole. And honestly, I would love to see more radical Chican@s in open source development.</p>
