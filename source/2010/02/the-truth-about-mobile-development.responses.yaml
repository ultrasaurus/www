    <p>Its true, that 71% of all Android users want to have an Android phone as their next phone. Though the iPhone users are even more loyal, their 89% number is quite normal for Apple users in General. However, there is not just one phone with an Android OS – there are a lot by now! Therefore, it is hard for Google / Android to provide the very same user experience on every Android phone.</p>
