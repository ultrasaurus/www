  author: "clibou"
  date: '2010-02-22T11:37:35-08:00'
  content: |-
    <p>Mobile app dev across 7 mobile platforms looks unsustainable. How could this shake out?</p>
    <p>* Mobile OS consolidation *<br>
    7 become 4: iPhone, Android, Web OS, Windows Mobile. (RIM buys Palm), (Microsoft buys Nokia).</p>
    <p>* Mobile HTML5 *<br>
    No software installed on phone. Browser based cache db provides the user experience during the disconnected state. Already <a href="http://m.ebay.com" rel="nofollow ugc">http://m.ebay.com</a></p>
    <p>* Mobile Android Development * <br>
    Write once, recompile code for other mobile app platforms. Active research projects via O’Reilly Inside Mobile Conference. <a href="http://360mobileconf.com/2009/08/insidemobile-awesome-write-up-from-clive-boulton/" rel="nofollow ugc">http://360mobileconf.com/2009/08/insidemobile-awesome-write-up-from-clive-boulton/</a></p>
    <p>Just some thoughts...</p>
