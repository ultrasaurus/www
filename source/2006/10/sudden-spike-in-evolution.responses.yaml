    <p>Gee.. you think perhaps the standard of females and math might have something to do with an unbiased education system? What a rubbish article, as if women have 'evolved' to become better at Math. No it's more likely our schools social structure now allows women to learn the same subjects as men. My parents generation had women doing sewing and cooking while men did woodwork and Math. Ridiculous.<br>
    Now it's a matter of getting the rest of our society up to speed.</p>
