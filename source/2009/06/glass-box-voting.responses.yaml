  content: |-
    <p>Thanks Sarah for your comments. I’m writing today from the National Civic Summit (#CivicSummit) where OSDV is speaking tomorrow 7/17/2009. We are engaged in dialogue with incredible activists, civic leaders, and elections officials from around the country. It’s been a wonderful conference thus far.</p>
    <p>Your thoughts combined with some of my discussions with other participants yesterday and today made me think of a few things I thought I might share with you. You wrote that open source is critical to security and privacy. I agree, but I would add that open source is only part of the solution for creating trustworthy systems. In addition to the technology, there need to be transparent audit and accountability processes. The combination of open source, transparent processes, and motivated, critical thinking elections officials and volunteers is a recipe for truly trustworthy elections.</p>
    <p>Your last point is right on. Voting is the cornerstone of our democracy and something so important must be public infrastructure.</p>
    <p>Thanks again for helping spread the word!</p>
    <p>Matt Douglass<br>
    TrustTheVote</p>
