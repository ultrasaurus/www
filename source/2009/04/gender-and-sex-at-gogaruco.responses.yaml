- id: 423
  author: "Ben Atkin"
  url: "http://benatkin.com/"
  date: '2009-04-23T09:12:28-08:00'
  content: |-
    <p>Sarah,</p>
    <p>"And if anyone reading this is working in a group with 4 or more men, see what you can do to make sure your next hire is a woman. Maybe the best candidate doesn’t know Ruby yet. At least make sure you interview a few women, before making a hiring decision."</p>
    <p>I was so turned off by the idea of suggesting a businessperson basing hiring decisions primarily on gender rather than skills or experience, that I missed the last part on my first read. I think you hit the nail on the head in the last sentence, though. It sounds like a great idea for a hiring manager to be sure to interview a few women! I think this alone could perhaps bring more talented women into the ruby community. If your hypothesis about women being less inclined to learn ruby in their free time is correct, then it seems that women who are skilled in another language ought to have no problem getting into ruby once they get a job programming ruby. For this to happen, however, women who don't have a lot ruby experience need to be offered interviews.</p>
    <p>Perhaps you could write a separate blog post about how to get women to apply and suggesting that companies interview a few of them.</p>
- id: 424
  author: "Julia Evans"
  url: "http://www.evansgate.blogspot.com"
  date: '2009-04-23T09:57:13-08:00'
  content: |-
    <p>Sarah,</p>
    <p>Thank you so much for writing about this issue. As you know, I too thought the material inappropriate for a professional conference. I emailed Matt personally (angrily at first, sorry to say, but more explanatory in a second attempt) and was surpprised by his inability to understand my problem with the slides. In my correspondence with Matt, he never acknowledged that there is a general standard of professional conduct outside his own peer group. By bringing a critique, I was accused of forcing my morals on him and trying to censor content.</p>
    <p>I, like you, am not offended bythe actual content. I am disappointed and shocked at the context. Anyone would get fired for presenting this in just about any professional context, worldwide. The fact that this is considered acceptable at a Ruby conference is disturbing.</p>
    <p>It is rare to see such oblivious and ignorant offence in this day and age.  Why is there such a large values gap between Ruby developers and the professional world at large? Perhaps because most Ruby developers are young and do not have very much experience working in a variety of environments. Maybe because they associate mostly with folks like themselves and do not get varying viewpoints. By isolating themselves from the larger professional world, they have made themselves the rednecks of software development. Perhaps we should call them "Ruby-necks"?</p>
    <p>In any case, this is a good example of how insular the software development environment is. It is a boy´s club, where locker-room behavior is overlooked, and indeed, not even acknowledged. Until now.</p>
- id: 425
  author: "Seth Rasmussen"
  url: "http://greatseth.com"
  date: '2009-04-23T12:11:52-08:00'
  content: |-
    <p>I'm glad Leah commented on how she doesn't think the lower female involvement is a symptom of a problem with the community. Those expressing disappointment that things aren't "better" should note this, especially the men expressing such things. If you want to reach out to women, great, but why not men, too? Why stop at gender differences? Etc.</p>
    <p>Julia, your opinions about what is appropriate conduct are just that. The fact that you couldn't commit to saying *all* professional contexts reinforces the reaction about moral judgement and censorship. You want to declare what is "right" and have it accepted. Matt did that in his own little way with his presentation. We all do it in varying ways every day. It's our right, but we're all better off when we can relax and be more tolerant because there are no black and white situations in life. You can disapprove all you like, but I think it distracts from things that really matter to focus on these kinds of details.</p>
    <p>On that note, somebody made a great point to me the other day: the real failure here is that everyone is talking about Matt's pictures and not the content of his talk. ;)</p>
