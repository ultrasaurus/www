  date: '2004-08-06T13:50:38-08:00'
  content: |-
    <p>This is a wonderful site.  My husband and I bought an old house built in 1925.  We now need to paint it.  We are novice so we got a painter but we still had to make some decisions as to the paint, finish and needed a few tips on what to talk to the painter about.  This site was very, very helpful in all we were trying to do.  I found the Website in the Lowe's catalog and I took every advantage.  The colo browser was wonderful and gave me some inspiration in choosing the color.  I feel like I can handle this challenge and will use the site again when we paint inside in the Fall.  I I had to rate this site by stars I would give it 4.5 stars.</p>
