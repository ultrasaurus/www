- id: 221
  author: "Harry Chesley"
  url: "http:/www.mememotes.com"
  date: '2005-06-01T09:50:48-08:00'
  content: |-
    <p>For some deep (and probably dark) psychological reason, I find myself somewhat uncomfortable with the idea of being a role model. I prefer to think we're all the same but some know more about some things than others. And that information is like a toy: you should play nice and share.</p>
    <p>In this particular case, one of the (many) reasons I hired you to work on Shockwave was because you knew much more than I did about graphics (obviously an important topic in that case), and I wanted to learn from you. I knew from our previous time working together at Apple that you liked to play nice. I think that was true of everyone working on Shockwave, and was one of the reason it's perhaps my favorite project ever.</p>
