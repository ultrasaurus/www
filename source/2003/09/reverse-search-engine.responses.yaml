  content: |-
    <p>Attended the Storesonline 8 hour seminar today.  I received a lot of information.  I did not purchase anything because I am a web developer and I can do everything myself.  But for those who cannot or don't think they can do it themselves, it could be a good deal.  They are not saying that you will become rich from doing this, they are selling the marketing tools to be able to sell your website, the tools to build your own site or they can build one for you by you "filling in the blanks" on their program.</p>
- id: 100
  author: "G.P. Roberts"
  date: '2005-03-14T22:13:42-08:00'
  content: |-
    <p>Went to the StoresOnLine eight hour seminar yesterday. Excellent information, good lunch, but keep your money in your pocket until you have had a chance to find out what the actual value of their services are. So far (and I could be wrong) it looks like most of what they promoted as pluses for their custom designed website is available on the net free or much cheaper.</p>
    <p>Good policy is to have nothing to do with any company that runs a "today only special" no matter how great it sounds. Personally, I would now felt ripped off if I had gone for it. On the other hand, there are apparently some people who have made a good thing  out of a StoresOnLine deal. Just do your own investigation first. Mine leads me to believe that what they offer is way overpriced.</p>
    <p>That said, I would advise anyone to attend one of their seminars, it is definitly worth the thirty bucks for the ideas presented.</p>
- id: 101
  author: "Andrew Linton"
  date: '2005-03-15T10:44:02-08:00'
  content: |-
    <p>I also attended the storesonline workshop in Ottawa this week.  Talk about an all day event.. My brain was hurting by the end of the day from filtering out all the "Act now" salespitch B.S. The actual classroom internet marketing training could have been summed up in a 20 to 30 minute lecture.  $2500 Plus tax for their services. What are their services?  Well, they didn't get real specific, and probably for good reason.  That gets you 3 websites for the year... and access to their software... Their software ain't worth that much. Neither are the websites.  They were doing more fishing than teaching.  Fishing for the ones that don't know enough to slow down and think... There must be other ways... Oh, and if you wanted a merchant account with your websites, they wanted another $1000!! You gotta be kidding me! Understand that they have to pay for all of there overhead to hold these conferences, travel, rent, meals, And you can be damn sure that the consultants get a commisson for everyone that signs on the dotted line.  What really blew me away is the amount of people that signed up.  Over 10 = $50,000!  Not bad for a day's work.</p>
