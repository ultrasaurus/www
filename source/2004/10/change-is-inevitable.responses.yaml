  content: |-
    <p>Sarah,</p>
    <p>Happened on your notes from our panel last year while I was assembling my blog on women at Apache yesterday.  It's been more than 6 months.  Are you enjoying open source?</p>
    <p>Danese</p>
- id: 190
  author: "Sarah Allen"
  url: "https://www.ultrasaurus.com"
  date: '2005-07-29T22:13:53-08:00'
  content: |-
    <p>Danese,</p>
    <p>Yes!  I am absolutely enjoying open source.  I am a regular contributor to the OpenLaszlo platform, even though my main gig at Laszlo these days is working on Laszlo Mail which is licensed software.</p>
    <p>With the encouragement of my colleagues at Laszlo who had more open source experience when we dove in, I regularly post to the OpenLaszlo developer list and participate in API design and coding in-the-open.  It's fun to be a part of something that is bigger than the company I work for.  It's a great experience.  I'm happy to report that OpenLaszlo contributors appear to have a better gender balance than the industry with about 10% women so far.  Perhaps over time we can do even better than that.</p>
    <p>To any techie or designer woman who may be reading this, all I can say is "come on in the water's fine!"</p>
    <p>Sarah</p>
