- id: 478
  author: "Aaron Quint"
  url: "http://www.quirkey.com"
  date: '2009-04-29T19:56:44-08:00'
  content: |-
    <p>I'm really glad that I was able to do something to get something started on this front. Whether or not *everyone* agrees I think getting more women involved in the current community and more kids involved in the future community is a great goal.</p>
    <p>I also think the idea of volunteer workshops is great, and I think a lot of our fellow Rubyists wouldn't mind spending an afternoon teaching or mentoring.</p>
    <p>Also, Id like some help and guidance from everyone on where to direct the money that gets collected. There have been a couple of ideas/suggestions already, but I'm looking for everyone's ideas.</p>
    <p>Maybe its worthwhile to set up a dedicated mailing list for this cause? I dont want to overdo it, but I also think it would be neat to have a way to spread the word about events or get group feedback on initiatives like this little fund.</p>
    <p>On another note - It's interesting you took the music video so litteraly. I think my intention was to play against this whole 'Rails is a Ghetto' meme and hoped that people got the whole 'if you want to break free you need to change your mindset first'.</p>
- id: 479
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-04-29T20:06:15-08:00'
  content: |-
    <p>It wasn't so much that I took the music video literally, but rather took the opportunity to clearly illustrate that the diversity issue goes beyond gender imbalance, and , with the hub-bub in the blog-o-sphere and twitterverse, I thought it a good way to put the whole thing in perspective.</p>
    <p>I think the Anita Borg foundation could be a great resource.  They may even have some on-going projects that would fit.  I also love the idea of a fund to help women speakers travel to events.  It would be cool to have a mailing list for folks who donate to the fund, then we could all decide how to focus efforts.</p>
- id: 480
  author: "Greg Borenstein"
  url: "http://ideasfordozens.com"
  date: '2009-04-29T23:32:50-08:00'
  content: |-
    <p>I'm both flattered and thrilled that you found my Ruby Arduino project inspiring on the learning programming front. I definitely think that being able to write a program that actually causes something to blink or move in the real world is thrilling and motivating in a whole different way than what happens on the screen, especially for people who are more hands-on thinkers than your typical programmer. One of my big motivations for writing RAD is to make learning physical computing as easy for beginners as it can possibly be. Arduino is a great project from an educational standpoint and it's taken this stuff from the deeply technical to the human, but I think the beauty and elegance of Ruby can take it even further. For beginners, all the "program junk" (type declarations, curly braces, etc) can be a pretty big obstacle when they're just trying to concentrate on the basics.</p>
    <p>Anyway, if I can help in anyway with your attempts to learn or teach Arduino please don't hesitate to contact me. In addition to myself, I've got access to a very vibrant community around this stuff up in Portland (including the creator of the Dorkboard) that has put on a ton of great educational events and could definitely help with educational materials.</p>
- id: 481
  author: "clibou"
  url: "http:cliveboulton.com"
  date: '2009-04-30T19:01:05-08:00'
  content: |-
    <p>Big Bold Steps, But Baby Steps...</p>
    <p>Is Ruby jumping the gun?</p>
    <p>Consider the brightest most select group of students I can imagine learn programing at Stanford and many other top universities by starting with Karel the Robot. <a href="http://www.youtube.com/watch?v=0LoKDDRlfZc" rel="nofollow ugc">http://www.youtube.com/watch?v=0LoKDDRlfZc</a></p>
    <p>Karel - "By initially limiting the student's language repertoire to easily grasped imperative commands whose actions are visually displayed, the Karel approach quickly introduces students to such concepts as procedures and the major control structures." <a href="http://en.wikipedia.org/wiki/Karel_(programming_language" rel="nofollow ugc">http://en.wikipedia.org/wiki/Karel_(programming_language</a>)</p>
    <p>As proof, at last years SV Codecamp <a href="http://www.siliconvalley-codecamp.com/" rel="nofollow ugc">http://www.siliconvalley-codecamp.com/</a> wI volunteered at GAE session <a href="http://tinyurl.com/csj49v" rel="nofollow ugc">http://tinyurl.com/csj49v</a> and due to huge demand, later at a Bebo day for teen kids run by SVWebBuilder.org. But in both cases, those kids who already had programing experience excelled, those without were left behind.</p>
    <p>Bottom line, find a simple Ruby project designed for teaching programming, or use Karel to reach new programmers.</p>
    <p>However accomplished<br>
    Props @ All</p>
    <p>I will back for TA ops</p>
