    <p>It's not just the feds whose hiring process sucks.  The standard hiring process at most private companies is just as bad, and would probably be even worse were they under a lot of the restrictions and requirements placed on the feds.</p>
    <p>The sad part is that some of the worst aspects could be <em>easily</em> addressed by technology with just a little thought, but they don't bother.  My favorite example is the goverment contractors whose jobs often require clearances, but their job boards don't le you search or filter that way AND they often don't even bother to state such needs in the text.  So a candidate goes through all the hassle of tailoring a resume, crafting a cover letter, etc., and if they're lucky enough to hear back, it might be "So do you have a TS/SCI and full scope poly?  We can't hire for this slot without one."  (For readers who don't know: very high clearance, rare to have, but frequently demanded.)  Brilliant... if the objective was to waste everybody's time....</p>
