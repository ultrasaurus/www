- id: 413
  author: "josh susser"
  url: "http://blog.hasmanythrough.com"
  date: '2009-04-21T07:05:02-08:00'
  content: |-
    <p>Thanks for the feedback. This has been on my mind for the last few days and I've been planning to solicit feedback directly from the women at the conference but haven't yet gotten to it. I'm definitely sensitive to these issues, and I acknowledge that I didn't do the best job I could have making sure the program met the standards I wanted it to.</p>
    <p>I do want to say that we did make a serious effort to be inclusive of women at the conference. I invited Jacqui Maher to speak not only because I think the work she does with Baobab Health is crucial and that I knew her talk would be great, but also because I think it's important to put good women presenters in the program both as role models and to attract other women to the conference. But many of the talks that were selected by voting got away from me, and I wasn't able to check them out beforehand to make sure they measured up. This is a good lesson for me for the future of the conference, and I'll know better next year.</p>
    <p>If you have ideas about how GoGaRuCo (or tech conferences in general) can be more inclusive, I definitely want to hear them. For now, Matt has promised me a version of his slides without the images that we can use to record the useful content of his talk.</p>
    <p>Feel free to contact me directly anytime. By the way, it was nice seeing you again at the conference, and thanks for all the great blogging on it.</p>
