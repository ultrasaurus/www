- id: 3294
  author: "Zack B."
  date: '2013-12-23T22:35:18-08:00'
  content: |-
    <p>I've been 'coding' for more than half of my life now. More recently (the past 5 years or so) I started doing so full time. I never finished college. I could've started my 'career' as a programmer much earlier than I did. The reasons why I didn't are varied, though finishing college may have accelerated it. Then again, it might not have.</p>
    <p>One issue that seems (to me anyway) to be lost in the general discussion (let's call it the Learn To Code discussion/debate) is the non-economic incentives in Science, Mathematics, and Computer Science. In other words, what ever happened to pursuit of knowledge for it's own sake? I know - the point gets addressed. But I think in a shallow way when everyone is just ultimately clamoring for money or credentials. Competing in a marketplace, basically.</p>
    <p>So yes, Computer Science is important. And you should learn it because it's not just useful, but beautiful. And so is Math. And probably any other interest you have. As Keynes said, "Practical men, who believe themselves to be quite exempt from any intellectual influence, are usually the slaves of some defunct economist"</p>
