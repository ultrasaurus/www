  content: |-
    <p>I like this version much better than the video one I saw... it was painful to sit through the pauses.  Generally, it's a good set of slides but I'd still dispute a few of the facts if not the implications. Also, there are no references that I can see.  For example, saying the population is less than the number of text messages "sent and received" each day makes me wonder if that counts each message twice--isn't each message sent also one that is received?  Or maybe some people send one message to several receivers.  Whatever, it's still good.  I just wouldn't want people to take the sound-bite-stats and believe them as is.</p>
