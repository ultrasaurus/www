  date: '2005-03-03T16:31:56-08:00'
  content: |-
    <p>I just attended the storesonline 8 hour workshop.  It was worth it - for $30 my son and I had a great lunch, networked with some interesting people and got a few good ideas and insights that will save me time and make me money. I would not however go for their package program.  Anytime someone says the "deal" is for today only you have to be skeptical.  However I counted over 25 people that did go for it and at $6K they have quite a nice business going.  I suppose if someone is not net savy or isn't able or willing to do the research then paying someone else may be ok.  I just didn't like not being able to do my due diligence before committing.</p>
