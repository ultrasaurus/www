    <p>I see it a different way.  The Internet has given birth to the ability to have mobile terminals to a hugely powerful store of data and computing power .  Because most of the *computing* doesn't occur on phones and other mobile devices.  There are a few apps that are entirely native, but they seem pretty toyish and not very popular with people unless they use the Internet.  In a way everyone has adopted "wearable computing" but without the social faux pas baggage of looking like a cyborg.</p>
    <p><a href="http://en.wikipedia.org/wiki/Wearable_computing" rel="nofollow ugc">http://en.wikipedia.org/wiki/Wearable_computing</a></p>
