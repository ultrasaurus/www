- id: 512
  author: "Brian Morearty"
  url: "http://ilikestuffblog.com/"
  date: '2011-01-02T09:23:32-08:00'
  content: |-
    <p>Sarah, I'm encouraged by reading your story of teaching 4th-5th graders and your other work teaching Ruby to women. Starting yesterday, I'm teaching my 11-year-old daughter how to program. (I taught her rudimentary HTML in the last year.)</p>
    <p>I don't plan to use the RailsBridge curriculum--I'm using Chris Pine's "Learn to Program" book instead--but I will incorporate some good ideas you described in this 3-part tale of teaching kids to program. Talking about computer history is a great idea, especially things that were created during the kids' lifetime. Your flashlight demo sounds great as well.</p>
    <p>I'll document our progress (mine and hers) on my blog, starting with <a href="http://ilikestuffblog.com/2011/01/02/teaching-my-11-year-old-daughter-to-program-in-ruby/" rel="nofollow ugc">http://ilikestuffblog.com/2011/01/02/teaching-my-11-year-old-daughter-to-program-in-ruby/</a></p>
    <p>Thanks for the ideas.</p>
- id: 513
  author: "Isa"
  date: '2011-03-10T07:47:59-08:00'
  content: |-
    <p>I'm so jealous of those kids having a "history of computers" class. Back when I was in 5th grade, my teachers were so new to the languages themselves that when there were glitches, our "mission" was to help them reprogram our own computer. Super fun, but we had to reinstall couple of computers. However, I started making a living programming and setting up "older people's" machines by 16.<br>
    I'm talking about some 15 years ago, though.  It was basic basic Internet, office and QBASIC (yeah... believe it).<br>
    Good luck! sounds like you can have a blast with those kids.</p>
