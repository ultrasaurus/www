- id: 11
  author: "Edward"
  url: "http://www.iokio.com"
  date: '2005-06-24T06:54:21-08:00'
  content: |-
    <p>Following launch of Omniscope in January 2005, Iokio just launched a second product, FeatureFinder, a Flash based product for creating interactive data interfaces for websites. If you have a look on www.iokio.com you can try some demos (no installation required) and download the full application for evaluation.</p>
    <p>This is the app used to create the updated CameraFinder demo that Macromedia gave as their primary example of a Rich Internet Application. You can install it on a pc and generate the swf files locally (you even stick them in a Powerpoint slideshow), then embed them in your site. No development knowledge needed.</p>
    <p>Check out the Butler Group blog on Omniscope at www.cbronline.com/blog.asp?show=butler_group/2005/06/seeing_is_belie.html</p>
