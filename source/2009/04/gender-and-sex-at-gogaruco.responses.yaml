- id: 427
  author: "Julia Evans"
  date: '2009-04-24T08:47:36-08:00'
  content: |-
    <p>Seth and Matt:</p>
    <p>Normally, I would have left this issue well alone by now. But I am faced with such gross incapacity to understand, i have to make one more comment:</p>
    <p>This is my contention: A presentation with a porn theme is not appropriate in a professional context.</p>
    <p>That is not my opinion. That is a fact. You can argue against this assertion two ways:</p>
    <p>1) Pornography is perfectly appropriate in a professional context. You could use this presentation anywhere and it would be acceptable.</p>
    <p>2) The Ruby conference was not professional. It is an exception. Standard rules of behavior do not apply because......</p>
    <p>You do NOT argue against my contention by siting corner cases or exceptions to the general rule, (entertainment industry) or attacking ad hominem, by calling into question my character.</p>
    <p>I am not saying that because I PERSONALLY believe this presentation was out of line you should agree with me.</p>
    <p>I am saying this presentation is out of line with general standards at large. You can agree or disagree with that.</p>
    <p>-Julia</p>
- id: 428
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-04-24T08:56:28-08:00'
  content: |-
    <p>Quoting Seth:  "You can disapprove all you like, but I think it distracts from things that really matter to focus on these kinds of details....On that note, somebody made a great point to me the other day: the real failure here is that everyone is talking about Matt’s pictures and not the content of his talk."</p>
    <p>And in my mind, and the majority consensus here, the failure is not a failure of the audience, but rather a failure of the talk to not focus on the topic, but rather to include distracting and unprofessional imagery.</p>
    <p>And to Julie:  I want to let you know that I don't think this is the norm for the Ruby community.  Every other man I met or heard speak at the conference was focused on the technology and communicating his excitement about the language or framework or whatever was the topic at hand.  The attendees were great to talk to, I enjoyed the conference a lot and learned a lot.  In general, the Ruby community is awesome and welcoming to anyone who shows an interest in the language.  This is the exception, not the rule.</p>
