  date: '2009-08-31T19:48:45-08:00'
  content: |-
    <p>Wow.  That's a different dialect than I learned.  Wikipedia notes that there are different consonants used in different dialects:</p>
    <p>"In words that begin with vowel sounds or silent consonants, the syllable "ay" is added to the end of the word. In some dialects, to aid in pronunciation, an extra consonant is added to the beginning of the suffix; for instance, eagle could yield eagle'yay, eagle'way, or eagle'hay."</p>
    <p><a href="http://en.wikipedia.org/wiki/Pig_Latin#Rules_and_variations" rel="nofollow ugc">http://en.wikipedia.org/wiki/Pig_Latin#Rules_and_variations</a></p>
