  date: '2004-11-07T11:56:04-08:00'
  content: |-
    <p>Hello came across your web site as a result of searching for 'reverse search engines'. Just to let you guys know that it does exist and so far one company has it, that I know of, at this time.  In order to use it you have to join their package plan of $6200.00 for six web sites that they create for you for your business. Then you can have access to their website for members only to use their tools like the reverse search engine and keyword analysis tool. Both of the tool alone can save you 30 to 40 hours of research for your web site. the reason I know this I have seen the tools in action at a Internet Marketing Workshop by StoresOnline,Inc at Orlando Florida. I did not what to dish out over 6,000 for use of there tools so I am looking on line for competitors of StoresOnline or a software package that does the same. If any body finds a software package post info here.</p>
    <p>ken</p>
