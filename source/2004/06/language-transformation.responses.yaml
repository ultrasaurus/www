  content: |-
    <p>"as if all languages could be visualized as surfaces in some n-dimensional space."</p>
    <p>Couldn't they? I see n=2: free-flowing multilanguage glyphs on the page surface, implying a chorus of vibrations underneath.</p>
    <p>The Mayan language, like Japanese, includes iconographic glyphs as well as phoenetic glyphs and numbers. Maybe word vibrations naturally clump in the mind and produce pictures. Phoenetic (phoenecian?) languages like English settle for word-icons, which Hrant Papazian calls 'boumas' - nonpictorial but recognizable.</p>
    <p>I'm just saying, a return to iconized vibrations wouldn't kill anybody. At this point, different clumps for spanish/english/arabic/japanese do more to separate us than to aid communication.</p>
