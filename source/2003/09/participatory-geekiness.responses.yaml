  content: |-
    <p>Ah yes - the old "kick the tires" syndrome.  Lots of discussions nowadays about tracking comments, RSS feeds that aggregate comments around topics and whatnot.  Just a simple notification that someone has left a comment would be cool.  Joi has a feed - which combines all his comments and Trackback - so I can follow the threads.  Ok - #1 down, 9 to go.</p>
- id: 72
  author: "Andrew Wooldridge"
  url: "http://cogworks.manilasites.com"
  date: '2003-10-02T13:01:45-08:00'
  content: |-
    <p>I share that feeling. I started out emailing friends  and family all these "look at this" or "this is a cool link" emails, and discovered that blogging was  a much more efficient way to satisfy that desire to pass on "neat" stuff.  Plus it's gratifying in that it's almost like being at "amateur night" at a nightclub and you get to be the only person up there - you can have a "captive" audience so to speak.</p>
    <p>I think alot of folks who originally created general websites  had this desire, and blogs seem to have evolved from the need to simplify the process.</p>
