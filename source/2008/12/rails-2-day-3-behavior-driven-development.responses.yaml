- id: 348
  author: "cyprian"
  date: '2011-10-03T19:08:44-08:00'
  content: |-
    <p>Sarah, thanks so much for sharing your efforts.  One question I have is this:<br>
    Do you have to use the ruby-rails framework to get webrat to work?  Can you just use garden-variety ruby?  It seems from all the sites I have visited, and the Rspec/Cucumber book I'm using that webrat is tightly coupled to Ruby-rails.</p>
    <p>Any insights you could share would be most appreciated.</p>
- id: 349
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2011-10-03T19:41:59-08:00'
  content: |-
    <p>I believe webrat is designed to work with rack apps, so it would work with Sinatra, but not PHP.  If you want to work with a non-Ruby webapp, look at Capybara using the Mechanize driver.  I wrote a short blog post about that here:  <a href="/2011/02/legacy-testing-with-capybaramechanize/" rel="nofollow ugc">/2011/02/legacy-testing-with-capybaramechanize/</a></p>
