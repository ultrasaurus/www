  content: |-
    <p>YuGiOh and Pokemon are gateway drugs to Magic: The Gathering. Magic was called Crack: The Addiction and Money: The Squandering back when it was new in the early/mid 90's. My kids have moved off of Pokemon and into Magic and YuGiOh but they make me the proudest when they play Netrunner. My moniker is a Netrunner reference, and it has been a staple in my home for years. Sadly it's not printed any more and the players have mostly scattered.</p>
    <p>Now to the point :)</p>
    <p>Enjoy YuGiOh while you can, as soon as he gets his first taste of Magic you will be in a whole new world.</p>
- id: 255
  author: "Jon"
  date: '2009-06-14T00:39:58-08:00'
  content: |-
    <p>Heh, sorry for the thread necromancy four years later, but I have to say, you're wrong about Yu-Gi-Oh! and Magic. I'm 21 and I still play Yu-Gi-Oh!, thoroughly enjoying the game more than I ever enjoyed Magic. I play in small tournaments at my local game shop every Saturday before the D&amp;D campaign, and I think the reason I like it better than Magic is because the Yu-Gi-Oh! crowd just wants to have fun with the game because we're a bunch of laid-back anime nerds. The Magic tournament crowd is way too serious, and they seem to have forgotten that it's just a game.</p>
    <p>In any case, take your kids to a couple of tournaments for each game, and they'll learn really fast that no matter how strategic the game, it's still no fun if you're playing with a bunch of jerks. Yu-Gi-Oh! may be more simple than Magic, but that's its very appeal - to find strategy in the simplicity.</p>
