- id: 258
  author: "Bryan Rieger"
  url: "http://bryanrieger.com"
  date: '2006-01-19T09:05:23-08:00'
  content: |-
    <p>Sarah,</p>
    <p>Thanks for sharing this, bringing back TONS of memories of Hypercard, Director, mTropolis, AfterEffects and all of the arts/tech things that drew me away from theatre, traditional animation and fine arts back in the (really) early 90's. I was (still am) also a HUGE Phish fan. ;-)</p>
    <p>It might just be me being silly and sentimental, but I tend to feel that despite the faster processors, vast amounts of memory and storage and the collaboration made possible via the internet that in general it's only gotten harder for non-geeks to make creative stuff with technology.</p>
    <p>Blogs are great, but expressing yourself through words isn't everybody's forte, nor is text necessarily the best way to present an idea.</p>
    <p>I know English based scripting languages fell out of fashion for various reasons, but as much as I love some of the concepts behind tools such as Flash, Processing, OpenLaszlo, Yahoo! Widgets, etc. - I can't help but wonder how 'average people' (re: Peter Small -'How God Made God', Brian Thomas - If Monks had Macs' - who made great things with no comp sci background) are going to contribute, beyond publishing text. Dot syntax, semi-colons, curly braces, subversion, mvc, delegates, etc all seem like a very big step backwards. A few years back I had huge hopes for Dreamfactory (<a href="http://www.dreamfactory.com/" rel="nofollow ugc">http://www.dreamfactory.com/</a>), but alas the too went enterprise...</p>
    <p>Oh well, for the next couple of hours I'l going to live in a simpler time, vicariously reliving these experiences thanks to this wonderful presentation set the Phish playing in the background. Perhaps I'll dig out some guache and a little E.E. Cummings and ditch the computer for a day. ;-)</p>
    <p>Sincerely,</p>
    <p>Bryan Rieger</p>
