- id: 727
  author: "Diana Blaine"
  date: '2011-03-11T22:41:59-08:00'
  content: |-
    <p>Bits,</p>
    <p>I wanted to put in my 2 cents because I've been in the same position in regard to Ruby on Rails. I'm still a newbie and have a ways to go but here's how my journey began. Took a Web Development class which covered front/back end technologies, tools &amp; servers (HTML, CSS, Javascript, J2EE, JDBC, MySQL, Eclipse, Dreamweaver, Apache, Tomcat). Obtained a basic knowlege but no work experience. Started to join meetups and came across SF Ruby Meetup where they held a RoR Workshop for Women. Men can attend if a women invites you as a guest. They have volunteer teachers to assist in installing the required software and then a workshop where you learn some commands to produce an app.  At this point, RoR was still foreign to me and most RoR meetups had topics or classes that were too advanced. I found one meetup that was geared towards the newbie and I received assistance in installing a VM(virtual machine using Ubuntu) on my Windows Vista OS since Windows OS is known to be problematic. Next, taking a RoR class at Blazing Cloud where Sarah is the head and teaches.  There are tons of books, tutorials on RoR so I can't advise which is the best. Sarah is writing a technical RoR book which she's been using in class. Not sure when it will be published but it's worth getting.</p>
    <p>A little more on the Blazing Cloud class, for me it's fast paced but packed with alot of good RoR stuff. They are now recording the class so that has been my crunch in learning. After the class, I basically take it over via the recording except I can pause it and take notes to figure things out.  Once the class is over, I'll have a better foundation and will go over everything by coding only until I'm fluent in what I've learned.</p>
    <p>My approach is painstaking but it's the only way I can upgrade my skillset.</p>
    <p>Hope this helps!</p>
