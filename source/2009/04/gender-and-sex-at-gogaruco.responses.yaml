- id: 433
  author: "Eric"
  date: '2009-04-25T15:44:59-08:00'
  content: |-
    <p>This debate seems to revolve around something very simple: respect. Respect for your work, respect for your audience, respect for your own ideas and presentation. Using Pr0n photos, jokes and concepts in your presentation shows a lack of respect.</p>
    <p>At my first tech job I did not dress in a professional way. I dressed in a very casual way. Nobody told me, "Hey, clean yourself up kid!" but I wish they would have. The signal I sent by what I was wearing was "I don't really respect this job, my colleagues, my boss or this company. In fact, I don't really respect the work I'm doing." I am sure I missed many opportunities to connect with people. What did I gain? A modicum of comfort. Looking back, I would have rather been able to connect with more cool people.</p>
    <p>Another example: In Arabic cultures it is disrespectful to point the soles of your feet at another person. That means that in an international context, it is inappropriate to sit in certain ways. What can one lose? A modicum of comfort. What can one gain? A friend.</p>
    <p>Adapting ourselves to others in a professional setting isn't about losing our own identity and values, it's about gaining the ability to come together and share.</p>
- id: 434
  author: "Giles Bowkett"
  url: "http://gilesbowkett.blogspot.com"
  date: '2009-04-25T17:41:47-08:00'
  content: |-
    <p>As I usually do, I'm going to make with the threadjack. People in the Ruby community don't know how to apologize gracefully. If you're going to defend yourself, defend yourself. If you're going to apologize, then apologize. Apologies like Matt's just look like a guy giving you the finger while wearing a suit. I'm going to tell you that nobody else minded - you're the weird one - and I'm going to explain how it was all right that I did what I did. And then I'm going to tell you I'm sorry I hurt your feelings, in a way that sounds not like saying "I'm sorry, I should have been considerate," but "I'm sorry for you, to be so weak that you need special treatment."</p>
    <p>I've seen this bullshit before, twice, and I didn't accept the apology either time. I don't think you should accept Matt's apology. That's a pathetic apology. You want to communicate compassion and consideration for the other person, not pity and self-righteousness.</p>
    <p>Obviously for me to dis people on self-righteousness is the pot calling the kettle black, but that was some condescending bullshit and I didn't like it. You don't dispute or bicker in an apology - that's just not the way to do it - and it's certainly not logical to act surprised. You made people uncomfortable by showing them inappropriate pictures of naked people. OMG! Who could have seen that one coming?</p>
    <p>I put huge slides with four-letter words on the screen when I give presentations, but it never makes anybody feel uncomfortable. But that's because there's an art to these things, and I know every time I do it that I might go too far and have to eat my pride and apologize. You did it wrong. The fact that anybody blogged about it means you did it wrong. So you have to just accept that and be a man about it instead of arguing with her. If a woman tells you that putting giant sexually suggestive images in front of her made her uncomfortable, you don't get to bicker about that. Your only option is to accept the humiliating consequences of what you did. Be grateful she used a blog post to tell you. She could have used a lawyer.</p>
