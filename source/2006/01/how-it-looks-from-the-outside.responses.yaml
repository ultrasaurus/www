    <p>From Raju, February 17, 2006  (somehow this comment was misplaced before this)</p>
    <p>Interesting thoughts about your life and work. I always have the problem to explain to emy parents what it means to develop software. Even my brother and my sister don't really understand what I'm doing.</p>
    <p>But there's one thing which came to my mind reading your blog: You said that <i>"There are people who work with me, whose job it is to find everything that is wrong with what we make."</i></p>
    <p>We went to Hungary a while ago where I met an impressive business consultant. That guy has a lot of management experience. I asked him where he learned how to manage people. He told me that all I have to know about management could be found in a small book called "The one minute manager". I read that book and was fascinated.</p>
    <p>According to that book a good manager should try to catch his co-workers doing something right and tell them about that. Of course he should be watching for the problems, too. But only focussing on things going wrong is not very positive. If you raise children you try to teach them doing the right things by telling them when they did something in a good way. But somehow we treat adults completely different from that. I liked that idea a lot. So I would like to some praising at this point:</p>
    <p>Well, I've been watching Laszlo Systems and the work you are doing for 1 1/2 years now and think it's really impressive. Maybe it's good to know that you don't only invent something every other day but by doing your work create a worldwide community of people fascinated by your work.</p>
    <p>In 2005 I learned so many new things about life and the internet by  starting the OpenLaszlo community in Berlin/Germany. I met Oliver Steele in Berlin, talked to David Temkin on the phone, learned all about Marc Canter and his ideas and got so many good ideas from the whole team at Laszlo Systems. My business partner and I plan on attending the Web 2.0 conference in 2006 in SF. I found Beate Fritsch through the internet, exchanged some emails with her (I was suprised that there are some Germany employees working for Laszlo Systems). And it's always fun to visit your blog ;-)</p>
    <p>So even if you don't see it everday your work influences the life, ideas and businesses of many people in this world in a very positive way.</p>
    <p>Good Luck for the year ahead, for you and your family!</p>
