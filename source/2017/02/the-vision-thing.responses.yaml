  date: '2017-02-20T12:03:59-08:00'
  content: |-
    <p>As usual, I love hearing how you think about complex issues. Motivation is complex! And while it's likely that complex perspectives are shared by a large number of people, they must be explained in detail, ipso facto, as they say. :-)</p>
    <p>So: when you say Good engineers will build something that works for a wider audience, I think you're already expecting Good equals super complex thinkers who track and comprehend your vision.</p>
    <p>Which means you all need to have it pretty baked.</p>
    <p>It's like playing Team Chess!</p>
    <p>For me, it's interesting to compare when considering this in the context of an existing team one might be corralling, or when putting together a new team of unknowns.</p>
    <p>xoxo</p>
