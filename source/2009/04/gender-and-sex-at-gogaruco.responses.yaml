  date: '2009-04-25T21:04:21-08:00'
  content: |-
    <p>Thanks everyone for the comments, but I think we're starting to tread over the same ground here.  I have appreciated the discussion, particularly the analysis as to why the imagery in Matt's talk didn't work out the way he planned.  Respect, context, humor, knowing when to draw the line and pushing the edge... this is a good conversation to have.</p>
    <p>I think the Ruby community is awesome.  The weird shit is reflective of society as a whole and the tech industry in particular.  Sometimes people are jerks.  Sometimes nice people act like jerks.  However, the cool stuff is genuine.  The enthusiasm is infectious.  It's not just a love the latest whiz bang techno-goodie (although there is a lot of that); many folks are interested in contributing to something bigger, <a href="https://www.ultrasaurus.com/sarahblog/2009/04/using-ruby-to-fight-aids/" rel="nofollow ugc">something that makes the world a better place</a>, even in the kinds of small ways that software can sometimes help.</p>
    <p>I've enjoyed most of the posts, and didn't censor the ones I thought were stupid, although I was tempted.  I am a bit disappointed in DHHs vapid <a href="http://twitter.com/d2h/status/1585995449" rel="nofollow ugc">contributions</a> to the discussion... too bad he has nothing more interesting to say to his 9,104 followers.</p>
    <p>Matt &amp; I exchanged some emails.  He's not a bad guy, and I do hope he writes somthing about CouchDB for the conference proceedings without the sexual overtones.  He's offered to answer my questions if/when I take a look at CouchDB and perhaps write the blog post that should have been.  I'll bet it'll have fewer comments.</p>
- id: 455
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-05-03T03:33:07-08:00'
  content: |-
    <p><a href="http://gja.in/" rel="nofollow ugc">Tejas Dinkar</a> notes a cultural reference that I missed:</p>
    <p>... and showed a picture (slide 13) with four drab looking people, including one women, ...</p>
    <p>This is the cast of "The IT Crowd", a british TV show (like the Office) [1]. There is nothing drab about them, and the guy with the funky haircut (Moss) is frankly awesome.</p>
    <p>[1] <a href="http://en.wikipedia.org/wiki/The_IT_Crowd" rel="nofollow ugc">http://en.wikipedia.org/wiki/The_IT_Crowd</a></p>
