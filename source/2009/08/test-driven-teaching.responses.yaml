- id: 594
  author: "Sarah"
  url: "https://www.ultrasaurus.com"
  date: '2009-08-24T09:10:00-08:00'
  content: |-
    <p>The <a href="http://github.com/edgecase/ruby_koans/tree/master" rel="nofollow ugc">Ruby Koans</a> are awesome.  I went through the first two and plan to set aside some time to meditate on them every day.  It does seem like such exercises would benefit from guidance from a Ruby Master.  For example,  in the following two koans:<br>
    <pre>
      # To understand reality, we must compare our expectations against
      # reality.
      def test_assert_equality
        expected_value = 2
        actual_value = 1 + 1

        assert expected_value == actual_value
      end

      # Some ways of asserting equality are better than others.
      def test_a_better_way_of_asserting_equality
        expected_value = 2
        actual_value = 1 + 1

        assert_equal expected_value, actual_value
    end
    </pre></p>
    <p>Why is it that assert_equal expected, actual is better than assert expected == actual?  It seems that the latter is quite legible and arguably more readable.</p>
- id: 595
  author: "Jamie Flournoy"
  url: "http://www.pervasivecode.com/"
  date: '2009-08-24T09:33:25-08:00'
  content: |-
    <p>IMO it's because of the output you get when the assertion fails.</p>
    <p>a = 1<br>
    b = 2<br>
    assert a == b # failure message says 'expected true but was false'<br>
    assert_equal a, b # failure message says 'expected 1 but was 2'</p>
    <p>The second failure message is more informative.</p>
