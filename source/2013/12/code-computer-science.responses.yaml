- id: 3535
  author: "LifeRuiner"
  date: '2013-12-24T09:21:49-08:00'
  content: |-
    <p>@Ryan S</p>
    <p>You sound resentful.  It is my opinion that you can be a brilliant developer without a degree.  You can be a high earning code monkey without a degree.  You can be a network admin, database admin, etc without a degree. You can call yourself a scientist without a degree.  You CANNOT call yourself an engineer without a degree.  And engineer explicitly implies you have formal training.</p>
    <p>I work as a network admin. I have a bachelors degree in computer science.  I started coding at 13, learned how to write enterprise applications as an intern, and worked as a developer for a short time after college.  The CS degree did not teach my software development, it did not teach me anything about networks or systems or servers, etc.  I learned math, logic, scientific computing, and natural science.  I would not trade my degree for any amount of experience.  I see it like this:</p>
    <p>A computer science degree doesn't make you a legitimate technologist.  80% of my classmates were not technologically savvy.  However, the degree does legitimize you as a professional ONLY AFTER you demonstrate your abilities.  When you have the proven abilities, coupled with the formal education, you are extremely employable.</p>
