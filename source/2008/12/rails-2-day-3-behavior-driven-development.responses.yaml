  author: "shane smith"
  date: '2009-02-22T13:57:30-08:00'
  content: |-
    <p>Thank you for this tutorial.<br>
    Webrat now has a "When I go to(.+)$/" step.<br>
    If you put the path webrat should visit in features/support/paths.rb, then webrat should be able to folow the "When I go to the tasks page" directive.</p>
