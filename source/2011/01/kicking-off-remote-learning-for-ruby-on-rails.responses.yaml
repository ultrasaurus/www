  content: |-
    <p>InstantPresenter has its flaws but in combination with physically attending the RoR class it is extremely beneficial to a newbie.  The class goes at a certain speed in order to get all the good RoR stuff in. InstantPresenter allows the student to retake the class, pause the viewing so notes can be written and/or research technical terms, and then proceed.  Due to the flaws inherit in InstantPresenter, I personnally still need to be physcially present in the class to absorb the lesson.  InstantPresenter makes is easy for me to fill in the gaps.</p>
