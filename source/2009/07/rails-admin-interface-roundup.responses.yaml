- id: 554
  author: "Jack Dempsey"
  url: "http://jackdempsey.me"
  date: '2010-09-07T20:39:31-08:00'
  content: |-
    <p>rutvij,</p>
    <p>There's a fork of active_scaffold that does work with rails 3:<br>
    <a href="http://github.com/vhochstein/active_scaffold" rel="nofollow ugc">http://github.com/vhochstein/active_scaffold</a></p>
    <p>You can easily install it with a project I've recently resurrected that's useful for quickly testing out ideas and libraries: <a href="http://jackdempsey.github.com/beet/" rel="nofollow ugc">http://jackdempsey.github.com/beet/</a></p>
    <p>beet --generate active_scaffold_test -r rails3/admin_interface/active_scaffold should do it.</p>
    <p>Enjoy!</p>
