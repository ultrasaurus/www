- id: 613
  author: "Jacob Rothstein"
  url: "http://www.jacobrothstein.com/"
  date: '2009-08-31T21:31:35-08:00'
  content: |-
    <p>I agree wholeheartedly about the inappropriateness of the to_json and to_xml methods.  As soon as you want to start messing with them, you're putting view code into the model layer, which is just wrong.  I was surprised there wasn't a JSON builder/template handler, so I hacked one out.  It's up on github at <a href="http://github.com/jbr/argonaut" rel="nofollow ugc">http://github.com/jbr/argonaut</a>.  I'm not certain that I feel the builder pattern is more elegant than just building up a Ruby hash and calling to_json on it, but it was certainly fun to build.  Yay Rails!</p>
- id: 614
  author: "Robin Curry"
  url: "http://blog.robincurry.com"
  date: '2009-08-31T21:35:30-08:00'
  content: |-
    <p>It definitely feels like a glaring omission that there is not a JSON builder similar to xml builder. The way I've gotten around this in an app where I had a similar issue was to create an erb template (i.e. index.json.erb) and build the json response inside by hand. Then just render the template in the format.json block instead. Seems like a kludge though.</p>
