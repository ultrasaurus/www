- id: 104
  author: "Donna"
  date: '2005-03-24T02:57:36-08:00'
  content: |-
    <p>I attended the stores online confrence here in new zealand yes you can get a lot of the things they talk about free or at a cheaper price.<br>
    But a lot of it seemed to be really good. My husband and i decided to buy the storefronts we had the option of 3 or 6 store fronts we brought 6 and have found them really good as well as helpful when we needed it we haven't paid them to do any of the work we done it ourselves then we would go into customer support chat once we thought we got it right and asked them if it was it hasn't cost us any more than what we paid.<br>
    I think stores online is like most products there are going to people who like it and people who don't. If you look hard enough you can find something bad about almost anything.<br>
    With our store fronts we have actually made some of our 6k back as we went to people we know that aren't too good with computers and prospected them for building a storefront for them adn we have agreed for a price to build and maintain th storefront for them we kept it at a reasonable price adn once hte store is making really good money we get a % of the sales.</p>
    <p>So all in all i haven't found anything wrong with stores online. I have always found them helpful and friendly and the websites are easy to design.</p>
    <p>We were told when we brought the storefronts what was in the kits and it had about selling storefronts or leasing them. So there are ways to make some of the money back if you do decide to buy them.</p>
