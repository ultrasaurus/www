  author: "Jamie Flournoy"
  url: "http://www.pervasivecode.com/"
  date: '2009-07-02T00:30:18-08:00'
  content: |-
    <p>I tried ActiveScaffold out a couple of weeks ago and didn't like it. I did like Streamlined, which I ended up using instead.</p>
    <p><a href="http://streamlinedframework.org/" rel="nofollow ugc">http://streamlinedframework.org/</a></p>
    <p>The RDoc is not very helpful but the Wiki is: <a href="http://trac.streamlinedframework.org/" rel="nofollow ugc">http://trac.streamlinedframework.org/</a> (at least I think that's the right wiki since it's down right this moment.)</p>
- id: 537
  author: "Sean Dick"
  url: "http://www.seandick.com"
  date: '2009-07-02T09:09:33-08:00'
  content: |-
    <p>Taking a quick look at streamlined, the same approach of namespacing admin versions of all of your controllers would still give you basically the same effect. If you wanted to be extra fancy, you could actually have your admin versions inherit from an admin controller:</p>
    <p>class Admin::AdminController &lt; ApplicationController<br>
      before_filter [:login_required, :must_be_admin]</p>
    <p>def must_be_admin<br>
        # add something to the flash maybe?<br>
        redirect_to "/" unless user.admin? and return<br>
      end<br>
    end</p>
