    <p>I was looking at the demos on the lazlo site and the auction video perplexed me a bit. It shows the app running in the windows IE browser and then there is a step where you choose your picture and the dialog that comes up is a MacOS file dialog... strange. I assume you will have to do this via an embeded html form that sends the data to the lazlo server and then back to Flash since the web player does not support this as of yet.</p>
