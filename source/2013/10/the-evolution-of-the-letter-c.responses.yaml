  content: |-
    <p>The evolution of alphabets is a favorite topic of mine. If you want to read a very convincing defense of the letter C (and all of the other wacky idiosyncrasies of English orthography), I highly recommend Geoffrey Sampson's "Writing Systems: A Linguistic Introduction".</p>
    <p>The short version: our irregular spelling encodes all kinds of metadata beyond just the pronunciation of the word. For one, it tells you the word's language of origin (e.g. Anglo-Saxon, Latin, French, Norse, or any of the many other languages we've borrowed from). This lets us attach different cultural connotations to words that are essentially synonyms: e.g. the informal "teaching" vs. the much more formal "pedagogy" ("car" vs. "automobile", etc.). The result: English is capable of encoding a lot of rich, nuanced information into short sentences. Languages that lack those extra layers simply need more words to say the same things, if they're capable of saying them at all. (Another language/writing pair that is similar to English in this way is Japanese, with its fiendishly complex array of syllabaries and logograms, many of which have multiple meanings and pronunciations depending on context... resulting in nuance a-plenty!)</p>
