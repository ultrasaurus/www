  content: |-
    <p>Looks great! Hopefully this gets some more media attention on your technology. I have been interviewing for work in Austin recently and  most places have not even heard of RIA development with XML-based scripting languages.</p>
    <p>It will be interesting to see how your new email app compares to Gmail, which for now seems to be the app to beat as far as RIAs go. I am impressed with Gmail, but I would bet that tools like yours could cut down on the development time significantly and offer better interactivity in the browser.</p>
