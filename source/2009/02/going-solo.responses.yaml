    <p>Congrats Sarah! I'm sure you will end up having a good interesting time. I'm been building up my own little consulting business since June, after 2 years at an ad agency. I'm so glad I was laid off. Working with many other companies, mostly from my own office, has been fun and surprisingly profitable. Not always easy, sometimes scary, but it has worked out better than I expected. I even get to work on silly side projects like this one: <a href="http://joe-sparks-post-it-art.blogspot.com/2009/01/egg-meet-bread-aw-yeah.html" rel="nofollow ugc">http://joe-sparks-post-it-art.blogspot.com/2009/01/egg-meet-bread-aw-yeah.html</a></p>
