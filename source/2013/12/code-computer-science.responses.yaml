- id: 3303
  author: "Phillip Haydon"
  url: "http://www.philliphaydon.com"
  date: '2013-12-23T22:56:02-08:00'
  content: |-
    <p>I don't have a degree, intact I dropped out of school at 16. Going to uni would have been a waste of time for me because I can't sit and focus and read and study.</p>
    <p>I started programming at 8 from a book on my commadore 64, then didn't code again till about 14 when I was building an Ulima Online server with a friend. I coded for that and taught myself PHP/Html/Css/JavaScript.</p>
    <p>A degree isn't what is needed. Passion is. So many devs lack passion for what they do. If you love programming. Your job is your hobby. After 10 years I wouldn't trade in my career or go back and do a degree.</p>
- id: 3306
  author: "James"
  date: '2013-12-23T23:02:43-08:00'
  content: |-
    <p>I as well am grateful for my CS degree because it gave me exposure to a lot of things that I wouldn't have been exposed to and/or wouldn't have investigated on my own, for example, much of the work in my Theory of Computing, Operating Systems, and Computer Architecture classes.</p>
    <p>The perfect CS program would have a balance of the practical and theory.  I've come across a lot of engineers that had an education weighed too much in one direction and either could code but had no theory/algorithms knowledge or had all the algo knowledge in the world but couldn't convert it to code. They rested on their laurels and stopped learning instead of seeing the degree as a headstart in a marathon and realizing that they can't stop running.</p>
    <p>The point that amonshiz brought up is also prevalent. Just as it is easier to pick up a third spoken language after picking up a second, the same can be said of programming languages. By graduation, I had real exposure to 6 languages with substantial coursework in 2-3 so it was really to pick up additional languages post-grad. The hard work of learning how to learn a new programming language was mostly done and I could get a quick start by doing a mental diff(oh this concept is like this language, that concept is close to this other one, etc).</p>
    <p>I believe it to be harder to get a balanced education through self-study but NOT impossible. However you made it to the table, as long as the code is clean and well-reasoned, I couldn't care less if you have a degree or not.</p>
