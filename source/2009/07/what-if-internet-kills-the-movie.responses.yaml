    <p>Thanks for this thoughtful and generous post.  I especially appreciate that you went back to the source and listened to the conversation between Cory and me.  I very much enjoyed talking to him that day, even though the format was pretty much subject/interviewer, rather than friend/friend.  Anyway, if I get the time I'll go back and listen to it again myself. It's been a while since I heard it.</p>
