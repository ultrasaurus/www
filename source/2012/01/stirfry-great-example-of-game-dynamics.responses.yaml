    <p>I downloaded the game and am letting my 5 yr. old 'test engineer' give it a go.</p>
    <p>"the element of chance is a key difference between something being work and something being play."</p>
    <p>This obviously has impacted the world of games, but this element also affects other areas of real business, things like customer retention and marketing. Think about the introduction of chance into a loyalty rewards program. Imagine if you had a 'chance' for a free first class upgrade when you booked a flight with reward miles. Elements along those lines seem to extend this chance phenomenon to more than just games.</p>
