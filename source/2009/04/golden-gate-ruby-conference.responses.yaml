  content: |-
    <p>I was thinking this whole controversy was generated by some gender angst driven hyper sensitive male who thought he needed to represent for female developers when no one was calling foul.  I know three female coders, and none of them thought there was a problem with the presentation.  two of them thought it was just a bad joke that didn't work, and one of them had suggestions for how to make the presentation funnier.</p>
    <p>Reading your post, I realize that at least one female coder was offended, and where there is one, there are more.  Thanks for adding your voice to the conversation so that an actual female coder perspective can be represented.  It was certainly useful to me to read that someone actually did feel uncomfortable.  While I would not have chosen the same slide set, until I read your post I was under the impression that this was much ado about hypersensitivity and protecting people who did not ask to be protected.</p>
