- id: 779
  author: "Jeff Casimir"
  url: "http://jumpstartlab.com"
  date: '2012-01-03T07:06:18-08:00'
  content: |-
    <p>Sarah,</p>
    <p>I won't lie -- I'm a little nervous. It's definitely quite a challenge from a teaching perspective. My solace is that people in the program will have every resource one could ask for -- instruction, support, mentorship, an experienced team, an awesome physical environment -- you name it.</p>
    <p>Back in the day, so many of us learned Rails, stumbling through Ruby at the same time, and would use the mailing list when you got stuck. There's value in struggling on your own, but when I talk to learners I over and over hear "I started, got stuck, worked on it for awhile, then moved on to other projects."</p>
    <p>I think we can dramatically accelerate learning. Only 12 hours/week will be in a classroom environment, the rest will be working in teams on projects and contributing back to the community. My hope is that the classroom provides the baseline fundamentals and the projects allow the space to fly.</p>
    <p>Thanks for your support and we'll surely talk more as the program gets started!</p>
