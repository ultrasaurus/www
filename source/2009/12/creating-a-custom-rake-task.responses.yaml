- id: 641
  author: "Ray"
  url: "http://67central.com/bc"
  date: '2009-12-20T11:36:20-08:00'
  content: |-
    <p>If you want your greet task to appear when you do 'rake -T' you need to add a description.</p>
    <p>Also  if you envision doing 'rake gems:install' at any point to you should move 'require faker' into the body of a task. Otherwise if you run 'rake gems:install' without faker installed, rake will fail. Here you could put it as the first line of your 'fake_people' task but you could also create a 'require_faker' task that did the require and was a dependency of 'require_people'.</p>
