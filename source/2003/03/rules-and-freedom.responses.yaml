    <p>This I think this is the basis for the dynamic success of Legos. Not withstanding the corporate behemoth that it has become, Legos are the types of toys that have no end to unjoyment for kids. Unlike battery powered mechanical toys that sell well to parents, but become boring to kids in just a few moments.</p>
