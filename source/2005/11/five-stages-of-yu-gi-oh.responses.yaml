  url: "https://www.ultrasaurus.com"
  date: '2005-11-27T17:37:51-08:00'
  content: |-
    <p>Yeah, there's definitely been a lot of imaginary monsters, traps and spells.  My favorite was a trap that my son invented which would remove one of your monsters from play -- you could use it as it was being attacked.  I suggested we call it "Deus Ex Machina" and then needed to translate from latin.  I don't think he got the literary reference, but it was fun trying to explain it!</p>
    <p>Someone should make a kit for creating cards like the kind you make during the holidays for creating plates from drawings.</p>
