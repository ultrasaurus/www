- id: 236
  author: "Karen"
  url: "http://www.hoofnagle.org"
  date: '2005-06-28T14:11:32-08:00'
  content: |-
    <p>Everyone has a favorite stupid vi trick. You didn't ask, but I can't stand it. I have to share mine:  recorded buffers.</p>
    <p>qa = start recording all my keystrokes in buffer a<br>
    esc (if you're in insert mode) q = stop recording my keystrokes.</p>
    <p>Then there's the joy of having all those buffers recorded:</p>
    <p>@a = run the keystrokes in buffer a.<br>
    32@a = run the keystrokes in @a 32 times.</p>
    <p>I know some explanations don't travel well without demonstration (or everyone would be in love with vi -- right?) so if I explain badly, ask Scott what I'm babbling about. He knows.</p>
