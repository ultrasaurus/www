    <p>It was great fun working with you at Laszlo, and I sure learned a lot by sitting down and doing code reviews with you! I will always remember first meeting you at Kaleida Labs, when you installed a copy of COSA AfterEffects on  the Mac in the lab, which rocked my world! I am glad we crossed paths years later and worked together at Laszlo, because you're so friendly and fun to work with, even though you Totally Get Shit Done!</p>
